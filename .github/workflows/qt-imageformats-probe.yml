name: Qt ImageFormats probe
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      runner:
        required: true
        type: string
      mode:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: ${{ inputs.runner }} / ${{ inputs.mode }}
    if: ${{ (inputs.runner == 'windows-2022' || inputs.runner == 'macos-15-intel') && (inputs.mode == 'cold' || inputs.mode == 'hit') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.mode == 'cold' && 55 || 25 }}
    env:
      XDZIP_MACOS_INTEL_CI: ${{ inputs.runner == 'macos-15-intel' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Download the matching same-run Qt image bundle
        if: inputs.mode == 'hit'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-qt-image-bundle-${{ inputs.runner }}
          path: build/qt-image-probe
          digest-mismatch: error
      - name: Measure Qt image module preparation and verify PNG and TIFF pixels
        shell: pwsh
        env:
          QT_IMAGE_MODE: ${{ inputs.mode }}
          XDZIP_RELEASE_QT_NETWORK_TOKEN: ${{ github.token }}
        run: ./scripts/ci-release.ps1 -Stage QtImage -QtNetworkMode auto -QtImageMode $env:QT_IMAGE_MODE
      - name: Preserve the verified QtGui and TIFF binaries with their licenses
        if: inputs.mode == 'cold'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-qt-image-bundle-${{ inputs.runner }}
          path: build/qt-image-probe/qt-image.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Preserve timing, decode results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-qt-image-${{ inputs.runner }}-${{ inputs.mode }}-${{ github.run_attempt }}
          path: |
            build/qt-image-probe/evidence/*.json
            build/qt-image-probe/evidence/*.log
            build/review/qt-network-prepare.json
            build/review/ci-timings.json
          retention-days: 14
