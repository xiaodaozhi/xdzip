# .github/workflows/windows-native-visual.yml

name: Windows native visual diagnostic
on:
  workflow_dispatch:
    inputs:
      focused_failures:
        description: Diagnose gallery hover and mixed directory geometry only, not full visual acceptance
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: windows-native-visual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-visual:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and sample the owned native Windows client
        shell: pwsh
        run: ./scripts/ci-windows-native-visual.ps1 -FocusedFailures:('${{ inputs.focused_failures }}' -eq 'true')
      - name: Preserve diagnostic evidence even when desktop capture is blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.focused_failures && 'windows-native-failures' || 'windows-native-visual' }}-${{ github.sha }}
          path: |
            build/windows-native-visual/
            !build/windows-native-visual/private-temp/**
            build/native-visual-desktop/desktop-build.json
            build/native-visual-desktop/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
