name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag for a formal release
        type: string
      candidate:
        description: Build, verify, and download unsigned Actions artifacts only
        type: boolean
        default: false
      retry_probe:
        description: In candidate mode, interrupt the first Windows package verification to exercise resumption
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.candidate && github.run_id || inputs.tag }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      snap_stable: ${{ steps.source.outputs.snap_stable }}
    steps:
      - name: Check release or candidate inputs
        env:
          CANDIDATE: ${{ inputs.candidate }}
          RETRY_PROBE: ${{ inputs.retry_probe }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE" == true ]]; then
            [[ -z "$RELEASE_TAG" ]]
          else
            [[ "$RETRY_PROBE" == false && "$GITHUB_REF" == refs/heads/main ]]
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate && github.sha || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false
      - name: Freeze source revision for every job
        id: source
        env:
          CANDIDATE: ${{ inputs.candidate }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/sync-version.py --check
          revision=$(git rev-parse HEAD)
          if [[ "$CANDIDATE" == false ]]; then
            version=$(python3 -c 'import runpy; print(runpy.run_path("scripts/sync-version.py")["version_info"]()["display_version"])')
            [[ "$RELEASE_TAG" == "v$version" ]]
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          snap_stable=false
          if [[ "$CANDIDATE" == false && "$GITHUB_REPOSITORY" == xiaodaozhi/xdzip && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            snap_stable=true
          fi
          echo "snap_stable=$snap_stable" >> "$GITHUB_OUTPUT"

  draft:
    if: ${{ !inputs.candidate }}
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-policy
          persist-credentials: false
      - name: Check reviewed notes and prepare the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/publish-release.py --draft-only --notes-file "release-policy/release-notes/${RELEASE_TAG#v}.md" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

  macos-signing-preflight:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Check native CLI code and resource signing
        run: |
          python3 scripts/test-cli-bundle.py
          python3 scripts/test-macos-udf-compatibility.py

  native:
    needs: [resolve, draft, macos-signing-preflight]
    if: always() && !cancelled() && needs.resolve.result == 'success' && needs.macos-signing-preflight.result == 'success' && (inputs.candidate || needs.draft.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      XDZIP_MACOS_INTEL_CI: ${{ matrix.os == 'macos-15-intel' && '1' || '' }}
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 180 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Select the upstream Ubuntu archive for Snap release
        if: runner.os == 'Linux' && needs.resolve.outputs.snap_stable == 'true'
        run: bash scripts/ci-release-snap.sh mirror
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-release-dependencies
      - name: Prepare locked Snap inputs before compiling
        if: runner.os == 'Linux' && needs.resolve.outputs.snap_stable == 'true'
        run: bash scripts/ci-release-snap.sh prepare
      - name: Build and package the native desktop and CLI candidate once
        shell: pwsh
        run: ./scripts/ci-release.ps1 -Stage Build
      - name: Pack the stable Snap from the same Linux build
        if: runner.os == 'Linux' && needs.resolve.outputs.snap_stable == 'true'
        run: bash scripts/ci-release-snap.sh pack
      - name: Preserve the verified Snap and its build receipt
        if: runner.os == 'Linux' && needs.resolve.outputs.snap_stable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snap-amd64
          path: build/snap-store/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-built-${{ runner.os }}${{ matrix.os == 'macos-15-intel' && '-X64' || '' }}
          path: build/release-handoff/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-build-evidence-${{ runner.os }}${{ matrix.os == 'macos-15-intel' && '-X64' || '' }}-${{ github.run_attempt }}
          path: |
            build/review/*.json
            build/release-package/*.json
            build/release-package/*.log
            build/review/native-sessions*.log
            build/review/x11-startup/
            build/desktop/apps/desktop/*tests.log
            build/desktop/apps/desktop/browser-tests-shard-*.log
            build/desktop/Testing/Temporary/LastTest.log
            build/toolchain/qt-network-security/*/*.log
          retention-days: 30

  verify:
    needs: [resolve, native]
    if: always() && !cancelled() && needs.resolve.result == 'success' && needs.native.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      XDZIP_MACOS_INTEL_CI: ${{ matrix.os == 'macos-15-intel' && '1' || '' }}
    # Linux permits a real GitHub anonymous quota reset.
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 100 || 35 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-built-${{ runner.os }}${{ matrix.os == 'macos-15-intel' && '-X64' || '' }}
          path: build/release-handoff
      - name: Restore the hash-checked native handoff
        run: python scripts/release_handoff.py unpack
      - name: Interrupt only the first Windows candidate verification
        if: inputs.candidate && inputs.retry_probe && runner.os == 'Windows' && github.run_attempt == 1
        shell: pwsh
        run: throw 'Candidate verification retry probe'
      - name: Install pinned packaging verification dependencies
        shell: pwsh
        run: |
          python -c "import sys, subprocess; sys.path.insert(0, 'scripts'); from desktop_environment import PYTHON_PACKAGES; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *[f'{name}=={version}' for name, version in PYTHON_PACKAGES.items()]])"
      - name: Verify the restored native package and installation lifecycle
        shell: pwsh
        run: ./scripts/ci-release.ps1 -Stage Verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verified-${{ runner.os }}${{ matrix.os == 'macos-15-intel' && '-X64' || '' }}
          path: build/release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-verify-evidence-${{ runner.os }}${{ matrix.os == 'macos-15-intel' && '-X64' || '' }}-${{ github.run_attempt }}
          path: |
            build/release-handoff/receipt.json
            build/review/*verify*.json
            build/review/*verification/*.json
            build/release-package/*verify*.json
            build/release-package/*verification/*.json
            build/review/*install-lifecycle.*
            build/review/installer-diagnostics/
            build/review/linux-runtime.*
            build/review/windows-runtime-test-*/*.log
            build/review/windows-runtime-test-*/result.json
          retention-days: 30

  contracts:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Check version and release contracts
        run: |
          python3 scripts/sync-version.py --check
          python3 scripts/test-version.py
          python3 scripts/test-release-protocol.py
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          python3 scripts/prepare-native-codecs.py
          cmake -S . -B build/release-contract-worker -G Ninja -DCMAKE_BUILD_TYPE=Release -DXDZIP_BUILD_QT_PROBE=OFF
          cmake --build build/release-contract-worker --target xdzip-native-codec --parallel 2
          export XDZIP_NATIVE_CODEC="$GITHUB_WORKSPACE/build/release-contract-worker/tools/native-codec/xdzip-native-codec"
          export XDZIP_NATIVE_CODEC_WORKER="$XDZIP_NATIVE_CODEC"
          export XDZIP_CAB_BACKEND=rust
          cargo test --workspace --locked
          python3 scripts/check-runtime-worker-tests.py --worker "$XDZIP_NATIVE_CODEC" --output build/release-runtime-tests
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/test-release-updates.py


  candidate-assembly:
    if: always() && !cancelled() && inputs.candidate && needs.resolve.result == 'success' && needs.verify.result == 'success' && needs.contracts.result == 'success'
    needs: [resolve, verify, contracts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-verified-*
          path: build/downloaded
      - name: Assemble the unsigned candidate
        run: |
          python3 scripts/release_handoff.py collect
          python3 scripts/prepare-release.py --packages build/packages --output build/assembled --repository "$GITHUB_REPOSITORY" --validation-only --include-intel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: build/assembled/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  candidate-download:
    if: always() && !cancelled() && inputs.candidate && needs.resolve.result == 'success' && needs.candidate-assembly.result == 'success'
    needs: [resolve, candidate-assembly]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build/assembled
      - run: python3 scripts/publish-release.py --directory build/assembled --verify-candidate --include-intel

  sign:
    if: ${{ !inputs.candidate }}
    needs: [resolve, verify, contracts]
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - name: Check stable Snap Store configuration
        if: needs.resolve.outputs.snap_stable == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo 'Configure SNAPCRAFT_STORE_CREDENTIALS in the release-signing environment.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-verified-*
          path: build/downloaded
      - name: Collect verified bytes
        run: |
          python3 scripts/release_handoff.py collect
          rustup toolchain install 1.99.0 --profile minimal
      - name: Assemble complete immutable release
        env:
          XDZIP_UPDATE_KEY_ID: ${{ vars.XDZIP_UPDATE_KEY_ID }}
          XDZIP_UPDATE_SIGNING_KEY_HEX: ${{ secrets.XDZIP_UPDATE_SIGNING_KEY_HEX }}
          XDZIP_SPARKLE_SIGNING_KEY_HEX: ${{ secrets.XDZIP_SPARKLE_SIGNING_KEY_HEX }}
        run: |
          python3 scripts/sign-macos-update.py --directory build/packages
          python3 scripts/sign-macos-update.py --directory build/packages --architecture x86_64
          python3 scripts/prepare-release.py --packages build/packages --output build/assembled --repository "$GITHUB_REPOSITORY" --require-update-signature --include-intel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: build/assembled/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    if: ${{ !inputs.candidate }}
    needs: [resolve, sign]
    environment: release-signing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-policy
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: build/assembled
      - name: Download the same-run Snap build
        if: needs.resolve.outputs.snap_stable == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-snap-amd64
          path: build/snap-store
      - name: Install Snapcraft
        if: needs.resolve.outputs.snap_stable == 'true'
        run: sudo snap install snapcraft --classic --channel=9.x/stable
      - name: Check the tag and publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SNAP_STABLE: ${{ needs.resolve.outputs.snap_stable }}
        run: |
          set -euo pipefail
          name="refs/tags/$RELEASE_TAG"
          revision=$(git ls-remote origin "$name^{}" | cut -f1)
          if [[ -z "$revision" ]]; then revision=$(git ls-remote origin "$name" | cut -f1); fi
          [[ "$revision" == "$(git rev-parse HEAD)" ]]
          rustup toolchain install 1.99.0 --profile minimal
          publication=--defer-public-check
          if [[ "$SNAP_STABLE" == true && "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == false ]]; then
              publication=--verify-public
            fi
          fi
          python3 scripts/publish-release.py --directory build/assembled --notes-file "release-policy/release-notes/${RELEASE_TAG#v}.md" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" "$publication" --include-intel
      - name: Upload and verify the tagged Snap on latest/stable
        if: needs.resolve.outputs.snap_stable == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REVISION: ${{ needs.resolve.outputs.revision }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: python3 -B release-policy/scripts/snap_store.py build/snap-store "$SOURCE_REVISION" "$RELEASE_TAG"

  verify-public:
    if: ${{ !inputs.candidate }}
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-policy
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: build/assembled
      - name: Download and verify the public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/publish-release.py --directory build/assembled --notes-file "release-policy/release-notes/${RELEASE_TAG#v}.md" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --verify-public --include-intel
