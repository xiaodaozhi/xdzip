name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-policy
      - name: Validate version-specific reviewed notes
        run: |
          VERSION=$(python3 -c 'import runpy; print(runpy.run_path("scripts/sync-version.py")["version_info"]()["display_version"])')
          NOTES="release-policy/release-notes/$VERSION.md"
          python3 scripts/publish-release.py --check-notes --notes-file "$NOTES"
      - name: Keep a draft until all native packages pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(python3 -c 'import runpy; print(runpy.run_path("scripts/sync-version.py")["version_info"]()["display_version"])')
          NOTES="release-policy/release-notes/$VERSION.md"
          python3 scripts/publish-release.py --draft-only --notes-file "$NOTES" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
  native:
    needs: draft
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install Linux build and X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libpcre2-dev libicu-dev libglib2.0-dev libzstd-dev libkrb5-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-util1 libxcb-xinerama0 libxcb-xkb1 libx11-dev libx11-6 libx11-xcb1 libxrender1 libxext6 libxi6 libxfixes3 libxrandr2 libfontconfig1 libfreetype6 libice6 libsm6 fonts-noto-cjk 7zip patchelf xvfb xauth openbox x11-utils
      - name: Native build, validation, deployment and package lifecycle
        shell: pwsh
        run: ./scripts/ci-release.ps1
      - name: Sign the final immutable macOS update archive
        if: runner.os == 'macOS'
        env:
          XDZIP_SPARKLE_SIGNING_KEY_HEX: ${{ secrets.XDZIP_SPARKLE_SIGNING_KEY_HEX }}
        run: python3 scripts/sign-macos-update.py --directory build/release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}
          path: build/release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ runner.os }}
          path: |
            build/review/*.json
            build/review/native-sessions*.log
            build/review/x11-startup/*.json
            build/review/x11-startup/*.log
            build/review/windows-runtime-test-*/*.log
            build/review/windows-runtime-test-*/result.json
            build/desktop/apps/desktop/*tests.log
            build/desktop/Testing/Temporary/LastTest.log
            build/release-package/*.json
            build/release-package/*.log
            build/toolchain/qt-network-security/*/*.log
            build/toolchain/qt-network-security/*/verification/*.log
            build/toolchain/qt-network-security/*/verification/result.json
          retention-days: 30
  contracts:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Check version and release contracts
        run: |
          python3 scripts/sync-version.py --check
          python3 scripts/test-version.py
          python3 scripts/test-release-protocol.py
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          python3 scripts/prepare-native-codecs.py
          cmake -S . -B build/release-contract-worker -G Ninja -DCMAKE_BUILD_TYPE=Release -DXDZIP_BUILD_QT_PROBE=OFF
          cmake --build build/release-contract-worker --target xdzip-native-codec --parallel 2
          export XDZIP_NATIVE_CODEC="$GITHUB_WORKSPACE/build/release-contract-worker/tools/native-codec/xdzip-native-codec"
          export XDZIP_NATIVE_CODEC_WORKER="$XDZIP_NATIVE_CODEC"
          export XDZIP_CAB_BACKEND=rust
          cargo test --workspace --locked
          cargo test -p xdzip-runtime --locked native_backend_tests::seven_zip_ -- --ignored
          cargo test -p xdzip-runtime --locked native_backend_tests::rar4_rar5_ -- --ignored
          cargo test -p xdzip-runtime --locked native_backend_tests::rar5_solid_volumes_ -- --ignored
          cargo test -p xdzip-runtime --locked cab_backend_tests -- --ignored
          cargo test -p xdzip-runtime --locked optical_backend_tests -- --ignored
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/test-release-updates.py
  publish:
    needs: [draft, native, contracts]
    environment: release-signing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-policy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/downloaded
      - name: Assemble complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          XDZIP_UPDATE_KEY_ID: ${{ vars.XDZIP_UPDATE_KEY_ID }}
          XDZIP_UPDATE_SIGNING_KEY_HEX: ${{ secrets.XDZIP_UPDATE_SIGNING_KEY_HEX }}
          XDZIP_SPARKLE_SIGNING_KEY_HEX: ${{ secrets.XDZIP_SPARKLE_SIGNING_KEY_HEX }}
        run: |
          mkdir -p build/packages
          find build/downloaded/release-Windows build/downloaded/release-Linux build/downloaded/release-macOS -maxdepth 1 -type f -exec cp {} build/packages/ \;
          VERSION=$(python3 -c 'import runpy; print(runpy.run_path("scripts/sync-version.py")["version_info"]()["display_version"])')
          NOTES="release-policy/release-notes/$VERSION.md"
          rustup toolchain install 1.99.0 --profile minimal
          python3 scripts/prepare-release.py --packages build/packages --output build/public-release --repository "$GITHUB_REPOSITORY" --require-update-signature
          python3 scripts/publish-release.py --directory build/public-release --notes-file "$NOTES" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
