name: Issue 187 installed language probe
on:
  push:
    branches: [coding/issue187-live]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch immutable alpha.9 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/issue187-input | Out-Null
          gh release download v0.1.0-alpha.9 --repo xiaodaozhi/xdzip --pattern 'xdzip-0.1.0-alpha.9-windows-x86_64-setup.exe' --dir build/issue187-input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual installation and live language changes
        shell: pwsh
        run: ./.github/issue187-live.ps1
