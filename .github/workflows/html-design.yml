name: HTML design review
on:
  push:
    paths:
      - 'scripts/check-extract-fidelity.py'
      - 'scripts/check-integrity-progress.py'
      - 'docs/visual/create-reference.json'
      - 'docs/visual/result-reference.json'
      - 'build/review/create-controls/**'
      - 'docs/visual/extract-reference.json'
      - 'docs/visual/settings-reference.json'
      - 'build/review/extract-fidelity/**'
      - 'design/**'
      - 'resources/i18n/**'
      - 'scripts/generate-ui-messages.py'
      - 'scripts/check-ui-i18n.py'
      - 'scripts/*html*'
      - 'scripts/*asset*'
      - 'scripts/*brand*'
      - 'scripts/*directory-tree*'
      - 'docs/visual/directory-tree.json'
      - 'docs/visual/controls.json'
      - 'docs/visual/layout-scale.json'
      - 'scripts/generate-display-spec.py'
      - 'scripts/native_browser_zoom.py'
      - 'scripts/generate-control-tokens.py'
      - 'build/review/asset-review/**'
      - 'build/review/asset-consumers/**'
      - 'build/review/brand-and-assets*'
      - 'build/review/brand-and-assets/**'
      - 'build/review/html-header/**'
      - 'build/review/html-body/**'
      - 'build/review/html-body-review.md'
      - 'build/review/pane-header-alignment*'
      - 'build/review/pane-header-alignment/**'
      - '.github/workflows/html-design.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'scripts/check-extract-fidelity.py'
      - 'scripts/check-integrity-progress.py'
      - 'docs/visual/create-reference.json'
      - 'docs/visual/result-reference.json'
      - 'build/review/create-controls/**'
      - 'docs/visual/extract-reference.json'
      - 'docs/visual/settings-reference.json'
      - 'build/review/extract-fidelity/**'
      - 'design/**'
      - 'resources/i18n/**'
      - 'scripts/generate-ui-messages.py'
      - 'scripts/check-ui-i18n.py'
      - 'scripts/*html*'
      - 'scripts/*asset*'
      - 'scripts/*brand*'
      - 'scripts/*directory-tree*'
      - 'docs/visual/directory-tree.json'
      - 'docs/visual/controls.json'
      - 'docs/visual/layout-scale.json'
      - 'scripts/generate-display-spec.py'
      - 'scripts/native_browser_zoom.py'
      - 'scripts/generate-control-tokens.py'
      - 'build/review/asset-review/**'
      - 'build/review/asset-consumers/**'
      - 'build/review/brand-and-assets*'
      - 'build/review/brand-and-assets/**'
      - 'build/review/html-header/**'
      - 'build/review/html-body/**'
      - 'build/review/html-body-review.md'
      - 'build/review/pane-header-alignment*'
      - 'build/review/pane-header-alignment/**'
      - '.github/workflows/html-design.yml'
      - '.gitattributes'
permissions:
  contents: read
jobs:
  visual-anchors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install isolated review tooling
        run: |
          python3 -m venv .venv-design
          .venv-design/bin/pip install -r scripts/html-design-requirements.txt
          .venv-design/bin/python -m playwright install --with-deps chromium
      - name: Build and compare source anchors
        run: |
          export XDZIP_CHROMIUM="$(.venv-design/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          .venv-design/bin/python design/assets/fonts/build-subset.py --check
          .venv-design/bin/python design/assets/fonts/export-qt.py --check
          .venv-design/bin/python scripts/check-design-assets.py
          .venv-design/bin/python scripts/check-brand-corners.py --render
          .venv-design/bin/python scripts/check-asset-integration.py
          .venv-design/bin/python scripts/render-design-assets.py --gallery-only --standalone dist/xdzip-assets.html
          .venv-design/bin/python scripts/build-directory-tree-delivery.py --standalone dist/xdzip-directory-tree.html --package dist/xdzip-directory-tree.zip
          .venv-design/bin/python scripts/check-directory-tree-delivery.py
          .venv-design/bin/python scripts/check-ui-i18n.py
          .venv-design/bin/python scripts/generate-ui-messages.py --check
          .venv-design/bin/python scripts/build-html-design.py
          .venv-design/bin/python scripts/generate-display-spec.py --check
          .venv-design/bin/python scripts/generate-control-tokens.py --check
          .venv-design/bin/python scripts/check-html-settings.py
          .venv-design/bin/python scripts/check-html-preflight.py
          .venv-design/bin/python scripts/check-html-welcome.py
          .venv-design/bin/python scripts/check-html-controls.py
          .venv-design/bin/python scripts/check-html-header.py
          .venv-design/bin/python scripts/check-html-preview.py
          .venv-design/bin/python scripts/check-html-references.py
          .venv-design/bin/python scripts/check-html-scale.py
          .venv-design/bin/python scripts/check-html-density.py
          .venv-design/bin/python scripts/check-html-operation-ui.py
          .venv-design/bin/python scripts/check-integrity-progress.py
          .venv-design/bin/python scripts/check-html-create-controls.py
          .venv-design/bin/python scripts/check-extract-fidelity.py
          .venv-design/bin/python scripts/check-html-design.py
          .venv-design/bin/python scripts/build-html-header-review.py
      - name: Compare body anchors and build offline regional review
        run: |
          export XDZIP_CHROMIUM="$(.venv-design/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          body_check_exit=0
          .venv-design/bin/python scripts/check-html-body.py || body_check_exit=$?
          .venv-design/bin/python scripts/build-html-body-review.py
          exit "$body_check_exit"
      - name: Upload actual review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xdzip-html-design-evidence
          path: |
            build/review/html-settings/
            build/review/html-welcome/
            build/review/html-header/
            build/review/html-body/
            build/review/pane-header-alignment.md
            build/review/pane-header-alignment/
            build/review/html-scrollbars/
            dist/ui-density/
            build/create-style/html/
            build/review/asset-review/
            build/review/asset-consumers/
            build/review/brand-and-assets.md
            build/review/brand-and-assets/
            design/assets/brand/
            build/review/assets/validation.json
            design/assets/reference/tree-*.png
            design/hifi/screens/directory-tree*.png
            build/review/directory-tree/
            docs/ux/directory-tree.md
            docs/visual/directory-tree.json
            dist/html-operation-review/
            build/operation-repair/html/
            dist/flat-status-validation.json
            dist/html-preview-review/
            dist/html-reference-review/
            dist/html-design-review/
            dist/html-scale-review/
            dist/xdzip-header-review.html
            dist/xdzip-body-review.html
            dist/xdzip-welcome-design.html
            dist/xdzip-hifi-design.html
            dist/xdzip-hifi-design-1to1.html
            dist/xdzip-scale-review.html
            dist/xdzip-assets.html
            dist/xdzip-directory-tree.html
            dist/xdzip-directory-tree.zip
            build/review/main-window-components.md
            build/review/main-window-components/
            docs/ux/main-window-components.md
            docs/visual/controls.json
            dist/html-controls-review/
            dist/xdzip-components.html
          if-no-files-found: error
          retention-days: 14
