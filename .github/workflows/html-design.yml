name: HTML design review
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  html-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify complete source changes in shadow mode
        id: classify
        run: python3 scripts/ci-plan.py --scope html
      - name: Retain the source-bound plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-html-input-plan-${{ github.run_attempt }}
          path: build/ci-plans/html-plan.json
          if-no-files-found: error
          retention-days: 14

  visual-anchors:
    needs: html-plan
    if: always() && (needs.html-plan.result != 'success' || needs.html-plan.outputs.run_heavy != 'false')
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/build/ci-input-cache/pip
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/ci-input-cache/playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore verified dependency inputs
        id: dependency_inputs
        uses: ./.github/actions/cache-inputs
        with:
          scope: html
      - name: Install isolated review tooling
        run: |
          python3 -m venv build/ci-html-tools
          build/ci-html-tools/bin/pip install -r scripts/html-design-requirements.txt
          build/ci-html-tools/bin/python -m playwright install --with-deps chromium
      - name: Build and compare source anchors
        run: |
          source scripts/ci-timing.sh
          export XDZIP_CHROMIUM="$(build/ci-html-tools/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          ci_run anchors build/ci-html-tools/bin/python design/assets/fonts/build-subset.py --check
          ci_run anchors build/ci-html-tools/bin/python design/assets/fonts/export-qt.py --check
          ci_run anchors build/ci-html-tools/bin/python scripts/check-design-assets.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-brand-corners.py --render
          ci_run anchors build/ci-html-tools/bin/python scripts/check-asset-integration.py
          ci_run anchors build/ci-html-tools/bin/python scripts/render-design-assets.py --gallery-only --standalone dist/xdzip-assets.html
          ci_run anchors build/ci-html-tools/bin/python scripts/build-directory-tree-delivery.py --standalone dist/xdzip-directory-tree.html --package dist/xdzip-directory-tree.zip
          ci_run anchors build/ci-html-tools/bin/python scripts/check-directory-tree-delivery.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-ui-i18n.py
          ci_run anchors build/ci-html-tools/bin/python scripts/generate-ui-messages.py --check
          ci_run anchors build/ci-html-tools/bin/python scripts/build-html-design.py
          ci_run anchors build/ci-html-tools/bin/python scripts/generate-display-spec.py --check
          ci_run anchors build/ci-html-tools/bin/python scripts/export-hifi-titlebars.py
          ci_run anchors build/ci-html-tools/bin/python scripts/export-welcome-design.py
          ci_run anchors build/ci-html-tools/bin/python scripts/generate-control-tokens.py --check
          ci_run anchors build/ci-html-tools/bin/python scripts/sync-version.py --check
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-about.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-settings.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-confirmations.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-add-dialog.py --html --native-zoom --output build/review/add-dialog-html
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-password.py --native-zoom
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-desktop-integration.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-preflight.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-welcome.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-controls.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-tab-strip.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-header.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-preview.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-references.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-scale.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-density.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-operation-ui.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-operation-headers.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-integrity-progress.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-create-controls.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-extract-fidelity.py
          ci_run anchors build/ci-html-tools/bin/python scripts/check-html-design.py
          ci_run anchors build/ci-html-tools/bin/python scripts/build-html-header-review.py
      - name: Compare body anchors and build offline regional review
        run: |
          source scripts/ci-timing.sh
          export XDZIP_CHROMIUM="$(build/ci-html-tools/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          body_check_exit=0
          ci_run body build/ci-html-tools/bin/python scripts/check-html-body.py || body_check_exit=$?
          ci_run body build/ci-html-tools/bin/python scripts/build-html-body-review.py
          exit "$body_check_exit"
      - name: Upload actual review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xdzip-html-design-evidence
          path: |
            build/review/html-ci-timings.json
            build/review/ci-cache-html.json
            build/review/html-settings/
            build/review/add-dialog-html/
            build/review/desktop-integration/html/
            build/review/html-welcome/
            build/review/tab-strip/
            build/review/html-header/
            build/review/hifi-titlebars/
            build/review/welcome-design/
            build/review/html-body/
            build/review/pane-header-alignment.md
            build/review/pane-header-alignment/
            build/review/html-scrollbars/
            dist/ui-density/
            build/create-style/html/
            build/review/asset-review/
            build/review/asset-consumers/
            build/review/brand-and-assets.md
            build/review/brand-and-assets/
            design/assets/brand/
            build/review/assets/validation.json
            build/review/about/html/
            build/review/operation-headers/
            build/review/password/html/
            design/assets/reference/tree-*.png
            design/hifi/screens/directory-tree*.png
            build/review/directory-tree/
            docs/ux/directory-tree.md
            docs/visual/directory-tree.json
            dist/html-operation-review/
            build/operation-repair/html/
            dist/flat-status-validation.json
            dist/html-preview-review/
            dist/html-reference-review/
            dist/html-design-review/
            dist/html-scale-review/
            dist/xdzip-header-review.html
            dist/xdzip-body-review.html
            dist/xdzip-welcome-design.html
            dist/xdzip-password-design.html
            dist/xdzip-hifi-design.html
            dist/xdzip-hifi-design-1to1.html
            dist/xdzip-scale-review.html
            dist/xdzip-assets.html
            dist/xdzip-directory-tree.html
            dist/xdzip-directory-tree.zip
            build/review/main-window-components.md
            build/review/main-window-components/
            docs/ux/main-window-components.md
            docs/visual/controls.json
            dist/html-controls-review/
            dist/xdzip-components.html
          if-no-files-found: error
          retention-days: 14

      - name: Validate completed html evidence
        run: python scripts/ci-evidence.py collect --scope html --role html
      - name: Retain the same-run validation record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-html-input-html-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: build/ci-evidence/html-html-${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Save trusted dependency inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependency_inputs.outputs.hit != 'true'
        uses: ./.github/actions/cache-inputs
        with:
          scope: html
          mode: save

  html-gate:
    if: always()
    needs: [html-plan, visual-anchors]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download same-run plans and validation records
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-html-input-*
          path: build/ci-gate-input
          merge-multiple: false
      - name: Require every applicable job and platform
        if: always()
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-evidence.py gate --scope html
      - name: Retain the automatic summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-html-summary-${{ github.run_attempt }}
          path: build/ci-gate-results/html.json
          if-no-files-found: warn
          retention-days: 14
