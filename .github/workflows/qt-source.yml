name: Qt source runtime validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-sync-dev libxcb-shm0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxrender-dev libxext-dev libxi-dev libxfixes-dev libxrandr-dev libice-dev libsm-dev fonts-noto-cjk
      - name: Fingerprint trusted source build environment
        if: runner.os != 'macOS'
        id: qt-environment
        shell: pwsh
        run: |
          $value = "$env:ImageOS-$env:ImageVersion"
          $bytes = [Text.Encoding]::UTF8.GetBytes($value)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLower()
          "fingerprint=$hash" >> $env:GITHUB_OUTPUT
      - name: Cache trusted main source SDK inputs, Windows/Linux only
        id: qt-source-cache
        if: runner.os != 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/source-cache
            build/qt-source
          key: qt682-source-${{ runner.os }}-${{ steps.qt-environment.outputs.fingerprint }}-${{ hashFiles('scripts/corresponding-sources.json', 'scripts/build-qt-source.py') }}
      - name: Build required Qt sources and validate actual product
        shell: pwsh
        run: ./scripts/ci-qt-source.ps1
      - name: Prepare bounded source build diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/qt-source-records | Out-Null
          python scripts/collect-qt-source-records.py
      - name: Upload validation records only, never Qt SDK or Mac app
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xdzip-qt-source-${{ runner.os }}-${{ runner.arch }}
          path: build/qt-source-records/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve partial rebuild state after failure, Windows/Linux only
        if: failure() && runner.os != 'macOS' && steps.qt-source-cache.outcome == 'success' && steps.qt-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/source-cache
            build/qt-source
          key: qt682-source-${{ runner.os }}-${{ steps.qt-environment.outputs.fingerprint }}-${{ hashFiles('scripts/corresponding-sources.json', 'scripts/build-qt-source.py') }}
