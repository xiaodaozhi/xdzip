name: macOS Intel native CI
on:
  workflow_dispatch:
    inputs:
      native_acceptance_probe:
        description: Build only the native session and Cocoa fullscreen verification targets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-intel:
    if: ${{ !inputs.native_acceptance_probe }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      XDZIP_MACOS_INTEL_CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert native Intel host
        run: |
          test "$(uname -m)" = x86_64
          translated="$(sysctl -n sysctl.proc_translated 2>/dev/null || true)"
          test "${translated:-0}" = 0
      - name: Check architecture and update contracts before native dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          python3 scripts/test-desktop-environment.py
          python3 scripts/test-desktop-workflow.py
          python3 scripts/test-macos-attribution.py
          python3 scripts/test-macos-bundle.py
          python3 scripts/test-macos-dmg.py
          python3 scripts/test-sparkle-bundle.py
          python3 scripts/test-macos-production-update.py
          python3 scripts/test-release-protocol.py
          python3 scripts/test-release-updates.py
          cargo test --locked -p xdzip-update --lib
      - name: Prepare pinned native dependencies
        run: python3 scripts/desktop.py prepare --install-qt --install-rust --output-dir build/review
      - name: Build native desktop and CLI
        run: python3 scripts/desktop.py build --output-dir build/review
      - name: Check actual executable and dependency architectures
        run: |
          set -euo pipefail
          app=build/desktop/apps/desktop/xdzip.app/Contents/MacOS
          qt=build/toolchain/Qt/6.8.2/macos
          for binary in "$app/xdzip" "$app/xdzip-native-codec" "$app/xdzip-image-preview" \
            build/desktop/cli/bin/xdzip "$qt/lib/QtCore.framework/Versions/A/QtCore" \
            "$qt/lib/QtNetwork.framework/Versions/A/QtNetwork" "$qt/lib/QtGui.framework/Versions/A/QtGui" \
            "$qt/plugins/imageformats/libqtiff.dylib" \
            build/toolchain/Sparkle/2.10.0-xdzip-proxy.2/Sparkle.framework/Versions/B/Sparkle; do
            test -f "$binary"
            echo "Checking $binary"
            lipo "$binary" -verify_arch x86_64
          done
          find build/desktop -name 'libxdzip_qt_bridge.a' -print > build/review/intel-bridge-paths.txt
          test -s build/review/intel-bridge-paths.txt
          while IFS= read -r archive; do echo "Checking $archive"; lipo "$archive" -verify_arch x86_64; done < build/review/intel-bridge-paths.txt
      - name: Test native desktop, Rust and workers
        run: python3 scripts/desktop.py test --output-dir build/review
      - name: Test patched Sparkle proxy transport
        run: python3 scripts/check-macos-proxy.py --output build/review/macos-proxy
      - name: Retain validation records only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel-validation-${{ github.run_attempt }}
          path: |
            build/desktop/desktop-*.json
            build/desktop/Testing/Temporary/LastTest.log
            build/desktop/apps/desktop/*-tests.log
            build/desktop/apps/desktop/browser-tests-shard-*.log
            build/review/*.json
            build/review/macos-proxy/*.json
            build/review/macos-proxy/*.log
            build/toolchain/Sparkle/*-build.log
            build/toolchain/qt-network-security/**/*.log
            build/toolchain/qt-image-security/**/*.log
          if-no-files-found: warn
          retention-days: 14

  native-acceptance:
    if: ${{ inputs.native_acceptance_probe }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      XDZIP_MACOS_INTEL_CI: '1'
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the native Intel release dependencies
        env:
          XDZIP_RELEASE_QT_NETWORK_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = x86_64
          translated="$(sysctl -n sysctl.proc_translated 2>/dev/null || true)"
          test "${translated:-0}" = 0
          python3 scripts/desktop.py prepare --install-qt --install-rust --release-dependencies auto --output-dir build/review
      - name: Build the browser and shell checks
        run: |
          cmake -S . -B build/desktop -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DXDZIP_BUILD_DESKTOP_PREVIEW=ON -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$PWD/build/toolchain/Qt/6.8.2/macos" \
            -DPython3_EXECUTABLE="$PWD/build/toolchain/desktop-tools/bin/python" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DXDZIP_MACOS_HANDLER_RANK=Alternate
          cmake --build build/desktop --parallel 3 --target xdzip-browser-tests xdzip-shell-tests
          for target in xdzip-browser-tests xdzip-shell-tests; do
            lipo -verify_arch x86_64 "build/desktop/apps/desktop/$target"
          done
      - name: Verify the native sessions and both Cocoa fullscreen sequences
        run: |
          export PATH="$PWD/build/toolchain/Qt/6.8.2/macos/bin:$PATH"
          failed=0
          for pass in 1 2; do
            python3 scripts/check-native-sessions.py --tests build/desktop/apps/desktop/xdzip-browser-tests \
              --shell-tests build/desktop/apps/desktop/xdzip-shell-tests --macos-conflicts \
              --output "build/review/native-acceptance-$pass/native-sessions.json" || failed=1
          done
          exit "$failed"
      - name: Retain native acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel-native-acceptance-${{ github.run_attempt }}
          path: |
            build/review/native-acceptance-*/*.json
            build/review/native-acceptance-*/*.log
            build/review/dependencies/dependencies.json
            build/review/prepare.json
          retention-days: 14
