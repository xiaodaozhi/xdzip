name: Issue 223 macOS probe
on:
  push:
    branches: [coding/issue223]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cache-inputs
        with:
          scope: qt
      - name: Prepare and build
        shell: bash
        run: |
          set -euo pipefail
          qtroot="$RUNNER_TEMP/Qt"
          prefix="$qtroot/6.8.2/macos"
          tools="$RUNNER_TEMP/xdzip-desktop-tools"
          shared=(--qt-root "$qtroot" --qt-prefix "$prefix" --tools-dir "$tools" --build-dir build/desktop --output-dir build/review)
          python3 scripts/desktop.py prepare --install-qt --install-rust "${shared[@]}"
          python3 scripts/desktop.py build "${shared[@]}"
      - name: Repeat settings layout regression
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/Qt/6.8.2/macos/bin:$PATH"
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software
          mkdir -p build/issue223
          for iteration in 1 2 3; do
            build/desktop/apps/desktop/xdzip-browser-tests settingsAllPagesLayout -o "build/issue223/offscreen-$iteration.log,txt" -o -,txt
          done
      - name: Retain probe logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue223-macos-probe
          path: build/issue223/*.log
          if-no-files-found: warn
