name: UI font generation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fonts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check automatic offline font generation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv build/font-check-tools
          if ($LASTEXITCODE) { throw 'Cannot prepare font check tools' }
          $fontPython = if ($IsWindows) { 'build/font-check-tools/Scripts/python.exe' } else { 'build/font-check-tools/bin/python' }
          & $fontPython -m pip install -r design/assets/fonts/requirements.txt
          if ($LASTEXITCODE) { throw 'Cannot install pinned font tools' }
          & $fontPython scripts/ui-fonts.py prepare
          if ($LASTEXITCODE) { throw 'Cannot prepare pinned font source' }
          & $fontPython scripts/test-ui-fonts.py
          if ($LASTEXITCODE) { throw 'Font regression failed' }
          & $fontPython scripts/build-html-design.py --check
          if ($LASTEXITCODE) { throw 'HTML font integration failed' }
          New-Item -ItemType Directory -Force build/font-verification | Out-Null
          Copy-Item build/generated/fonts/manifest.json "build/font-verification/ui-font-${{ runner.os }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-font-${{ runner.os }}
          path: build/font-verification/*.json
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: fonts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-font-*
          path: build/font-verification
          merge-multiple: true
      - name: Require identical native and web font bytes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          directory = Path('build/font-verification')
          files = sorted(directory.glob('ui-font-*.json'))
          assert {p.name for p in files} == {'ui-font-Windows.json', 'ui-font-Linux.json', 'ui-font-macOS.json'}
          manifests = [json.loads(path.read_text()) for path in files]
          assert all(value == manifests[0] for value in manifests), 'Platform font inputs or output bytes differ'
          print('Windows, Linux and Apple Silicon macOS font generation manifests and output SHA-256 values match')
          PY
