name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Prepare isolated pinned Rust toolchain
        env:
          RUSTUP_HOME: ${{ runner.temp }}/xdzip-ci-rustup
        run: |
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          case "$(rustup which rustc)" in
            "$RUSTUP_HOME"/toolchains/1.99.0-*/bin/rustc) ;;
            *) echo "Rust compiler is outside the isolated toolchain" >&2; exit 1 ;;
          esac
      - name: Install lightweight check tools
        run: |
          python3 -m venv build/ci-check-tools
          build/ci-check-tools/bin/python -m pip install PyYAML==6.0.2 clang-format==18.1.8 -r design/assets/fonts/requirements.txt
          python3 scripts/ui-fonts.py prepare
      - name: Check documentation and generated sources
        run: |
          python3 scripts/sync-version.py --check
          python3 scripts/test-qt-network-security.py
          python3 scripts/test-windows-msix.py
          python3 scripts/test-macos-finder.py
          python3 scripts/check-docs.py
          node scripts/build-windows-store-assets.cjs --check
          node scripts/test-marketing-copy.cjs
          python3 scripts/test-platform-store-captures.py
          python3 scripts/test-package-marketing-assets.py
          python3 scripts/test-plan-marketing-sync.py
          python3 scripts/check-marketing-screenshot-scale.py
          python3 scripts/test-windows-store-languages.py
          python3 scripts/test-windows-store-listings.py
          node --check scripts/import-windows-store-captures.cjs
          node --check scripts/build-platform-store-assets.cjs
          node --check scripts/marketing-window-frame.cjs
          node --check scripts/build-macos-store-assets.cjs
          node --check scripts/build-linux-store-assets.cjs
          python3 scripts/test-check-docs.py
          python3 scripts/check-ui-i18n.py
          python3 scripts/generate-qml-theme.py --check
          python3 scripts/generate-format-registry.py --check
          python3 scripts/test-format-registry.py
          python3 scripts/test-runtime-worker-tests.py
          build/ci-check-tools/bin/python scripts/test-ui-fonts.py
          python3 scripts/check-window-contracts.py --self-test
          python3 scripts/check-operation-components.py
      - name: Check Rust and C++ formatting
        run: |
          cargo fmt --all -- --check
          python3 scripts/check-native-format.py --clang-format build/ci-check-tools/bin/clang-format
      - name: Run strict Clippy and dependency checks for Rust changes
        env:
          XDZIP_EVENT_NAME: ${{ github.event_name }}
          XDZIP_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/check-rust-clippy.py
      - name: Check workflow contracts
        run: build/ci-check-tools/bin/python scripts/test-ci-workflows.py
      - name: Check whitespace
        run: git diff-tree --check --root --first-parent -m HEAD
