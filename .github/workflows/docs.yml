name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Prepare isolated pinned Rust toolchain
        env:
          RUSTUP_HOME: ${{ runner.temp }}/xdzip-ci-rustup
        run: |
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          case "$(rustup which rustc)" in
            "$RUSTUP_HOME"/toolchains/1.99.0-*/bin/rustc) ;;
            *) echo "Rust compiler is outside the isolated toolchain" >&2; exit 1 ;;
          esac
      - name: Install lightweight check tools
        run: |
          python3 -m venv build/ci-check-tools
          build/ci-check-tools/bin/python -m pip install PyYAML==6.0.2 clang-format==18.1.8
      - name: Check documentation and generated sources
        run: |
          python3 scripts/sync-version.py --check
          python3 scripts/check-docs.py
          python3 scripts/test-check-docs.py
          python3 scripts/check-ui-i18n.py
          python3 scripts/generate-ui-messages.py --check
          python3 scripts/generate-qml-theme.py --check
          python3 scripts/generate-control-tokens.py --check
          python3 scripts/build-html-design.py --check
          python3 scripts/check-window-contracts.py --self-test
          python3 scripts/check-operation-components.py
      - name: Check Rust and C++ formatting
        run: |
          cargo fmt --all -- --check
          build/ci-check-tools/bin/clang-format --dry-run --Werror tools/bridge-probe/smoke.cpp tools/toolchain-probe/main.cpp tools/process-metrics/main.cpp tools/launch-services-probe/main.mm tools/native-codec/*.cpp tools/native-codec/*.hpp crates/xdzip-codec-bridge/include/*.hpp apps/desktop/*.cpp apps/desktop/*.h apps/desktop/tests/*.cpp tests/fixtures/native/*.c
      - name: Check workflow contracts
        run: build/ci-check-tools/bin/python scripts/test-ci-workflows.py
      - name: Check whitespace
        run: git diff-tree --check --root --first-parent -m HEAD
