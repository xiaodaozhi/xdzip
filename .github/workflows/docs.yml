name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check documentation links and assets
        run: |
          python3 scripts/check-docs.py
          python3 scripts/check-asset-integration.py
          python3 scripts/check-brand-corners.py
          python3 scripts/build-html-design.py --check
          python3 scripts/generate-qml-theme.py --check
          python3 scripts/generate-control-tokens.py --check
      - name: Check HTML design JavaScript syntax
        run: |
          node --check design/html/app.js
          node --check design/html/review.js
          node --check design/html/controls.js
          node --check design/html/main-controls.js
          node --check design/html/components.js
      - name: Check whitespace
        run: git diff-tree --check HEAD
