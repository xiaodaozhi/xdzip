name: Documentation
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check documentation links and assets
        run: |
          python3 scripts/sync-version.py --check
          python3 scripts/test-version.py
          python3 scripts/test-release-protocol.py
          python3 scripts/test-production-update-evidence.py
          python3 scripts/test-macos-production-update.py
          python3 scripts/test-production-update-signing.py
          python3 scripts/test-qt-production-update.py
          python3 scripts/test-native-window-manager.py
          python3 scripts/test-windows-native-ci.py
          python3 scripts/publish-release.py --check-notes
          python3 scripts/test-desktop-environment.py
          python3 scripts/test-desktop-workflow.py
          python3 scripts/test-ci-cache-inputs.py
          python3 scripts/test-ci-observability.py
          python3 scripts/test-native-codec-sources.py
          python3 scripts/test-native-cab-credit.py
          python3 scripts/test-deployment-audit.py
          python3 scripts/test-linux-deployment.py
          python3 scripts/test-runtime-attribution.py
          python3 scripts/test-macos-attribution.py
          python3 scripts/test-sparkle-bundle.py
          python3 scripts/test-native-runtime-materials.py
          python3 scripts/test-installers.py
          python3 scripts/test-macos-launch-services.py
          python3 scripts/test-macos-bundle.py
          python3 scripts/test-macos-dmg.py
          python3 scripts/test-repository-contents.py
          python3 scripts/test-source-delivery.py
          python3 scripts/test-qt-sdk-correspondence.py
          python3 scripts/test-qt-source-build.py
          python3 scripts/test-performance.py
          python3 scripts/test-wp12-readiness.py
          python3 scripts/check-macos-localization.py
          python3 scripts/check-ui-i18n.py
          python3 scripts/generate-ui-messages.py --check
          python3 scripts/check-docs.py
          python3 scripts/check-operation-components.py
          python3 scripts/check-window-contracts.py --self-test
          python3 scripts/check-asset-integration.py
          python3 scripts/check-brand-corners.py
          python3 scripts/build-html-design.py --check
          python3 scripts/generate-qml-theme.py --check
          python3 scripts/generate-control-tokens.py --check
      - name: Check HTML design JavaScript syntax
        run: |
          node --check design/html/app.js
          node --check design/html/review.js
          node --check design/html/controls.js
          node --check design/html/main-controls.js
          node --check design/html/components.js
      - name: Check whitespace
        run: git diff-tree --check HEAD
