name: Documentation
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify complete source changes in shadow mode
        id: classify
        run: python3 scripts/ci-plan.py --scope docs
      - name: Retain the source-bound plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-docs-input-plan-${{ github.run_attempt }}
          path: build/ci-plans/docs-plan.json
          if-no-files-found: error
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_HOME: ${{ runner.temp }}/xdzip-docs-rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare isolated pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          case "$(rustup which rustc)" in
            "$RUSTUP_HOME"/toolchains/1.99.0-*/bin/rustc) ;;
            *) echo "Rust compiler is outside the isolated toolchain" >&2; exit 1 ;;
          esac
          rustc --version
          cargo --version
          cargo clippy --version
          rustfmt --version
      - name: Install isolated desktop asset validation tools
        run: |
          python3 -m venv build/ci-asset-tools
          build/ci-asset-tools/bin/python -m pip install -r scripts/desktop-asset-requirements.txt
      - name: Check documentation links and assets
        run: |
          python3 scripts/sync-version.py --check
          python3 scripts/test-version.py
          python3 scripts/test-release-protocol.py
          python3 scripts/test-production-update-evidence.py
          python3 scripts/test-macos-production-update.py
          python3 scripts/test-production-update-signing.py
          python3 scripts/test-qt-production-update.py
          python3 scripts/test-native-window-manager.py
          python3 scripts/test-windows-native-ci.py
          python3 scripts/publish-release.py --check-notes
          python3 scripts/test-desktop-environment.py
          python3 scripts/test-desktop-workflow.py
          python3 scripts/test-ci-cache-inputs.py
          python3 scripts/test-ci-observability.py
          python3 scripts/test-ci-plan.py
          python3 scripts/test-ci-evidence.py
          python3 scripts/test-native-codec-sources.py
          python3 scripts/test-native-cab-credit.py
          python3 scripts/test-deployment-audit.py
          python3 scripts/test-linux-deployment.py
          python3 scripts/test-runtime-attribution.py
          python3 scripts/test-macos-attribution.py
          python3 scripts/test-sparkle-bundle.py
          python3 scripts/test-native-runtime-materials.py
          python3 scripts/test-installers.py
          python3 scripts/test-macos-launch-services.py
          python3 scripts/test-macos-bundle.py
          python3 scripts/test-macos-dmg.py
          python3 scripts/test-repository-contents.py
          python3 scripts/test-source-delivery.py
          python3 scripts/test-qt-tika-materials.py
          python3 scripts/test-qt-sdk-correspondence.py
          python3 scripts/test-qt-source-build.py
          python3 scripts/test-alpha8-qt-replacement.py
          python3 scripts/test-performance.py
          python3 scripts/test-wp12-readiness.py
          python3 scripts/check-macos-localization.py
          python3 scripts/check-ui-i18n.py
          python3 scripts/generate-ui-messages.py --check
          python3 scripts/check-docs.py
          python3 scripts/check-operation-components.py
          python3 scripts/check-window-contracts.py --self-test
          python3 scripts/check-asset-integration.py
          python3 scripts/check-brand-corners.py
          python3 scripts/build-html-design.py --check
          python3 scripts/generate-qml-theme.py --check
          python3 scripts/generate-control-tokens.py --check
      - name: Check desktop font and asset sources
        run: |
          build/ci-asset-tools/bin/python design/assets/fonts/build-subset.py --check
          build/ci-asset-tools/bin/python design/assets/fonts/export-qt.py --check
          build/ci-asset-tools/bin/python scripts/check-design-assets.py
          build/ci-asset-tools/bin/python scripts/generate-display-spec.py --check
          build/ci-asset-tools/bin/python scripts/test-ci-workflows.py
      - name: Check HTML design JavaScript syntax
        run: |
          node --check design/html/app.js
          node --check design/html/review.js
          node --check design/html/controls.js
          node --check design/html/main-controls.js
          node --check design/html/components.js
      - name: Check whitespace
        run: git diff-tree --check HEAD

      - name: Validate completed docs evidence
        run: python scripts/ci-evidence.py collect --scope docs --role docs
      - name: Retain the same-run validation record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-docs-input-docs-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: build/ci-evidence/docs-docs-${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 14

  docs-gate:
    if: always()
    needs: [docs-plan, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download same-run plans and validation records
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-docs-input-*
          path: build/ci-gate-input
          merge-multiple: false
      - name: Require every applicable job and platform
        if: always()
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-evidence.py gate --scope docs
      - name: Retain the automatic summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-docs-summary-${{ github.run_attempt }}
          path: build/ci-gate-results/docs.json
          if-no-files-found: warn
          retention-days: 14
