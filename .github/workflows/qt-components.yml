name: Qt components
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux graphics development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - name: Build, test and package native product
        shell: pwsh
        run: ./scripts/ci-desktop.ps1
      - name: Upload review build and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xdzip-m1-${{ runner.os }}-${{ runner.arch }}
          path: dist/review/
          if-no-files-found: error
          retention-days: 14
