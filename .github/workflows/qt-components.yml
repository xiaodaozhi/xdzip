name: Qt components
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 80 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux graphics development files
        if: runner.os == 'Linux'
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          for name in ('/etc/apt/sources.list', '/etc/apt/sources.list.d/ubuntu.sources'):
              path = Path(name)
              if path.is_file():
                  original = path.read_bytes()
                  updated = re.sub(rb'(https?://)azure\.archive\.ubuntu\.com(?=/ubuntu(?:[ \t\r\n/]|$))',
                                   rb'\1archive.ubuntu.com', original)
                  updated = re.sub(rb'(?<!\S)mirror\+file:/etc/apt/apt-mirrors\.txt(?=\s|$)',
                                   b'http://archive.ubuntu.com/ubuntu', updated)
                  if updated != original:
                      path.write_bytes(updated)
          PY
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-randr0 \
            libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-util1 libxcb-xinerama0 libxcb-xkb1 \
            libx11-dev libx11-6 libx11-xcb1 libxrender1 libxext6 libxi6 libxfixes3 libxrandr2 \
            libfontconfig1 libfreetype6 libice6 libsm6 fonts-noto-cjk 7zip zip patchelf xvfb xauth openbox x11-utils
      - name: Build and validate native product
        id: build_product
        shell: pwsh
        run: ./scripts/ci-desktop.ps1
      - name: Collect test diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/review/diagnostics' | Out-Null
          $qmlLogValid = (Test-Path 'build/desktop/apps/desktop/qml-tests.log' -PathType Leaf) -and ((Get-Item 'build/desktop/apps/desktop/qml-tests.log').Length -gt 0)
          if (Test-Path 'build/desktop/apps/desktop/browser-tests.log') { Copy-Item 'build/desktop/apps/desktop/browser-tests.log' 'build/review/diagnostics/' }
          if (Test-Path 'build/desktop/apps/desktop/qml-tests.log') { Copy-Item 'build/desktop/apps/desktop/qml-tests.log' 'build/review/diagnostics/' }
          if (Test-Path 'build/desktop/apps/desktop/update-tests.log') { Copy-Item 'build/desktop/apps/desktop/update-tests.log' 'build/review/diagnostics/' }
          if (Test-Path 'build/desktop/Testing/Temporary/LastTest.log') { Copy-Item 'build/desktop/Testing/Temporary/LastTest.log' 'build/review/diagnostics/' }
          if (Test-Path 'build/previous-product/previous-product.log') { Copy-Item 'build/previous-product/previous-product.log' 'build/review/diagnostics/' }
          if (Test-Path 'build/settings-compat/compile.log') { Copy-Item 'build/settings-compat/compile.log' 'build/review/diagnostics/settings-compat-compile.log' }
          if ($IsMacOS) {
            if (Test-Path 'build/desktop/visual-audit/*.json') { Copy-Item 'build/desktop/visual-audit/*.json' 'build/review/diagnostics/' }
          } elseif (Test-Path 'build/desktop/visual-audit') {
            Copy-Item -Recurse 'build/desktop/visual-audit' 'build/review/diagnostics/'
          }
          if ('${{ steps.build_product.outcome }}' -eq 'success' -and !$qmlLogValid) {
            throw 'Successful native validation must retain its raw QML test log'
          }
      - name: Upload review build and evidence
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xdzip-m4-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/review/
            !build/review/linux/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS validation records only
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xdzip-checks-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/desktop/apps/desktop/browser-tests.log
            build/desktop/apps/desktop/update-tests.log
            build/desktop/Testing/Temporary/LastTest.log
            build/review/*.json
            build/review/visual-audit/fidelity.json
            build/review/native-sessions*.log
            build/review/tab-strip-native/*.json
            build/review/add-dialog*/*.json
            build/review/browser-timings/*.log
            build/review/browser-timings/*.json
            build/review/diagnostics/*.log
            build/review/diagnostics/*.json
          if-no-files-found: warn
          retention-days: 14
