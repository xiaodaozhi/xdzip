name: Qt components
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux-qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Qt development tools
        run: |
          python3 -m venv /tmp/xdzip-aqt
          /tmp/xdzip-aqt/bin/pip install aqtinstall==3.3.0
          /tmp/xdzip-aqt/bin/aqt install-qt linux desktop 6.8.2 linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - name: Build and check components
        run: |
          export Qt6_DIR="$RUNNER_TEMP/Qt/6.8.2/gcc_64/lib/cmake/Qt6"
          export PATH="$RUNNER_TEMP/Qt/6.8.2/gcc_64/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/Qt/6.8.2/gcc_64/lib"
          cmake -S . -B build/qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DXDZIP_BUILD_DESKTOP_PREVIEW=ON
          cmake --build build/qt
          qmllint apps/desktop/ui/*.qml
          ctest --test-dir build/qt --output-on-failure
