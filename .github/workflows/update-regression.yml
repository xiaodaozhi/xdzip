# .github/workflows/update-regression.yml

name: Native update regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-regression-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned native compiler, installer and supplier agreement
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          ./scripts/prepare-windows-installer.ps1 -OutputDirectory build/installer-toolchain
          python scripts/prepare-windows-runtime.py --output build/windows-runtime
      - name: Real owned old-to-new Inno updater regression
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -prerelease -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python scripts/check-windows-update.py --output build/update-regression/windows
      - name: Preserve updater evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: update-regression-windows
          path: |
            build/update-regression/windows/*.json
            build/update-regression/windows/*.log
          if-no-files-found: error
          retention-days: 14
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare native Apple Silicon SDK and pinned toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          python3 -m pip install aqtinstall==3.3.0
          python3 -m aqt install-qt mac desktop 6.8.2 clang_64 --outputdir '${{ runner.temp }}/Qt'
      - name: Real owned old-to-new native Sparkle updater regression
        run: python3 scripts/check-macos-update.py --qt-prefix '${{ runner.temp }}/Qt/6.8.2/macos' --output build/update-regression/macos
      - name: Preserve updater records without application packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: update-regression-macos
          path: |
            build/update-regression/macos/*.json
            build/update-regression/macos/*.log
            build/update-regression/macos/cases/*/*.json
            build/update-regression/macos/cases/*/*.log
          if-no-files-found: error
          retention-days: 14
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build disposable Ubuntu native updater test image
        run: |
          docker build -f tests/fixtures/native/update-linux.Dockerfile -t xdzip-update-regression .
      - name: Real owned old-to-new pkexec and APT updater regression
        run: |
          mkdir -p build/update-regression
          docker run --rm --network none --cap-add SYS_PTRACE --env XDZIP_ISOLATED_UPDATE_FIXTURE=1 --mount type=bind,source="$PWD",target=/repo,readonly --mount type=bind,source="$PWD/build/update-regression",target=/evidence xdzip-update-regression python3 scripts/check-linux-update.py --output /evidence/linux --offline
      - name: Preserve updater evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: update-regression-linux
          path: |
            build/update-regression/linux/*.json
            build/update-regression/linux/*.log
          if-no-files-found: error
          retention-days: 14
