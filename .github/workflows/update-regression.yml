# .github/workflows/update-regression.yml

name: Native update regression
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to diagnose, or all for final verification
        required: true
        default: all
        type: choice
        options: [all, windows, macos, macos-intel, linux]
      macos_product_only:
        description: Diagnose the macOS product chain only, ignored for all-platform verification
        required: false
        default: false
        type: boolean
      dependencies:
        description: Use a verified Qt Network artifact when available, or force a source build
        type: choice
        default: auto
        options: [auto, cold]
permissions:
  contents: read
  actions: read
concurrency:
  group: update-regression-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false
jobs:
  windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare pinned native compiler, installer and supplier agreement
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          ./scripts/prepare-windows-installer.ps1 -OutputDirectory build/installer-toolchain
          python scripts/prepare-windows-runtime.py --output build/windows-runtime
      - name: Real owned old-to-new Inno updater regression
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -prerelease -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python scripts/check-windows-update.py --output build/update-regression/windows
      - name: Install the base Qt SDK
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0 -r design/assets/fonts/requirements.txt
          python -m aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 --outputdir '${{ runner.temp }}/Qt'
      - name: Prepare and validate native Qt Network
        id: qt_network
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XDZIP_DEPENDENCY_MODE: ${{ inputs.dependencies }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -prerelease -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $publish = @()
          if ($env:GITHUB_REF -eq 'refs/heads/main') { $publish += '--publish' }
          python scripts/ci-qt-network.py prepare --qt-prefix '${{ runner.temp }}/Qt/6.8.2/msvc2022_64' --output build/update-qt-network --mode $env:XDZIP_DEPENDENCY_MODE @publish
      - name: Build two private real Qt products and complete their native upgrade
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -prerelease -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:XDZIP_ISOLATED_UPDATE_FIXTURE = '1'
          $env:PATH = "${env:USERPROFILE}/.cargo/bin;${env:PATH}"
          $session = Join-Path $PWD 'build/update-regression/windows-qt-session'
          python scripts/check-native-qt-update.py --prepare --qt-prefix '${{ runner.temp }}/Qt/6.8.2/msvc2022_64' --output build/update-regression/windows-qt --session-directory $session
          python scripts/check-native-qt-update.py --output build/update-regression/windows-qt --password-task
      - name: Preserve updater evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-regression-windows
          path: |
            build/update-regression/windows/*.json
            build/update-regression/windows/*.log
            build/update-regression/windows-qt/*.json
            build/update-regression/windows-qt/*.log
            build/update-regression/windows-qt/failed-install-recovery/*.json
            build/update-regression/windows-qt/failed-install-recovery/*.log
            build/update-qt-network/qt-network-prepare.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the verified Qt Network dependency
        if: github.ref == 'refs/heads/main' && steps.qt_network.outputs.bundle != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.qt_network.outputs.bundle }}
          path: build/update-qt-network/qt-network.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
  macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare native Apple Silicon SDK and pinned toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          python3 -m pip install aqtinstall==3.3.0 -r design/assets/fonts/requirements.txt
          python3 -m aqt install-qt mac desktop 6.8.2 clang_64 --outputdir '${{ runner.temp }}/Qt'
      - name: Prepare and validate native Qt Network
        id: qt_network
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XDZIP_DEPENDENCY_MODE: ${{ inputs.dependencies }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then set -- --publish; else set --; fi
          python3 scripts/ci-qt-network.py prepare --qt-prefix '${{ runner.temp }}/Qt/6.8.2/macos' --output build/update-qt-network --mode "$XDZIP_DEPENDENCY_MODE" "$@"
      - name: Check production-signing admission with test keys only
        run: python3 scripts/test-production-update-signing.py
      - name: Check native CLI code and resource sealing
        run: python3 scripts/test-cli-bundle.py
      - name: Verify the actual native Sparkle proxy transport
        env:
          XDZIP_ISOLATED_UPDATE_FIXTURE: '1'
        run: |
          python3 scripts/prepare-sparkle.py --output build/toolchain/Sparkle/2.10.0-xdzip-proxy.2
          python3 scripts/test-system-proxy-fixture.py
          python3 scripts/check-macos-proxy.py --output build/update-regression/macos-proxy --system-conflicts
      - name: Real owned old-to-new native Sparkle updater regression
        if: ${{ inputs.platform != 'macos' || !inputs.macos_product_only }}
        run: python3 scripts/check-macos-update.py --qt-prefix '${{ runner.temp }}/Qt/6.8.2/macos' --output build/update-regression/macos
      - name: Complete the real macOS product controller update and ordinary restart
        env:
          XDZIP_ISOLATED_UPDATE_FIXTURE: '1'
        run: python3 scripts/check-macos-product-update.py --qt-prefix '${{ runner.temp }}/Qt/6.8.2/macos' --output build/update-regression/macos-product
      - name: Preserve updater records without application packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-regression-macos
          path: |
            build/update-regression/macos/*.json
            build/update-regression/macos/*.log
            build/update-regression/macos/cases/*/*.json
            build/update-regression/macos/cases/*/*.log
            build/update-regression/macos-product/*.json
            build/update-regression/macos-product/*.log
            build/update-regression/macos-product/session/*.json
            build/update-regression/macos-proxy/*.json
            build/update-regression/macos-proxy/*.log
            build/toolchain/Sparkle/*-build.log
            build/update-qt-network/qt-network-prepare.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the verified Qt Network dependency
        if: github.ref == 'refs/heads/main' && steps.qt_network.outputs.bundle != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.qt_network.outputs.bundle }}
          path: build/update-qt-network/qt-network.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
  macos_intel:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-intel' }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      XDZIP_MACOS_INTEL_CI: '1'
      XDZIP_ISOLATED_UPDATE_FIXTURE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare and check product font tools
        run: |
          python3 -m pip install -r design/assets/fonts/requirements.txt
          PYTHONPATH=scripts python3 -c 'from ui_fonts import tools; tools()'
      - name: Check update fixture contracts before native dependencies
        run: |
          python3 scripts/test-macos-production-update.py
          python3 scripts/test-system-proxy-fixture.py
          python3 scripts/check-system-proxy-fixture.py
      - name: Prepare pinned native Intel dependencies
        run: |
          test "$(uname -m)" = x86_64
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          python3 -m pip install aqtinstall==3.3.0
          python3 -m aqt install-qt mac desktop 6.8.2 clang_64 --outputdir '${{ runner.temp }}/Qt'
      - name: Prepare and validate native Qt Network
        id: qt_network
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XDZIP_DEPENDENCY_MODE: ${{ inputs.dependencies }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then set -- --publish; else set --; fi
          python3 scripts/ci-qt-network.py prepare --qt-prefix '${{ runner.temp }}/Qt/6.8.2/macos' --output build/update-qt-network --mode "$XDZIP_DEPENDENCY_MODE" "$@"
      - name: Check Intel update and fixture admission contracts
        run: |
          python3 scripts/test-release-updates.py
      - name: Verify Intel product update, installation and restart with test keys
        run: python3 scripts/check-macos-product-update.py --qt-prefix '${{ runner.temp }}/Qt/6.8.2/macos' --output build/update-regression/macos-intel-product
      - name: Preserve updater records without application packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-regression-macos-intel
          path: |
            build/update-regression/macos-intel-product/*verification*.json
            build/update-regression/macos-intel-product/*.log
            build/toolchain/Sparkle/*-build.log
            build/update-qt-network/qt-network-prepare.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the verified Qt Network dependency
        if: github.ref == 'refs/heads/main' && steps.qt_network.outputs.bundle != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.qt_network.outputs.bundle }}
          path: build/update-qt-network/qt-network.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
  linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build disposable Ubuntu native updater test image
        run: |
          docker build -f tests/fixtures/native/update-linux.Dockerfile -t xdzip-update-regression .
      - name: Real owned old-to-new pkexec and APT updater regression
        run: |
          mkdir -p build/update-regression
          docker run --rm --network none --cap-add SYS_PTRACE --env XDZIP_ISOLATED_UPDATE_FIXTURE=1 --mount type=bind,source="$PWD",target=/repo,readonly --mount type=bind,source="$PWD/build/update-regression",target=/evidence xdzip-update-regression python3 scripts/check-linux-update.py --output /evidence/linux --offline
      - name: Prepare the isolated Qt SDK image and validate Qt Network
        id: qt_network
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XDZIP_DEPENDENCY_MODE: ${{ inputs.dependencies }}
        run: |
          publish=0
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then publish=1; fi
          bash scripts/ci-update-qt-linux.sh "$XDZIP_DEPENDENCY_MODE" build/update-qt-network "$publish"
      - name: Build two private real Qt products in a separate SDK image
        run: |
          docker run --rm --env XDZIP_ISOLATED_UPDATE_FIXTURE=1 --mount type=bind,source="$PWD",target=/repo,readonly --mount type=bind,source="$PWD/build/update-regression",target=/evidence xdzip-update-qt-build python3 scripts/check-native-qt-update.py --prepare --qt-prefix /opt/Qt/6.8.2/gcc_64 --output /evidence/linux-qt --session-directory /home/xdzipfixture/qt-session
      - name: Complete the real Qt upgrade in an independent SDK-free runtime
        run: |
          PACKAGES=$(python3 -c 'import json; print(" ".join(json.load(open("build/update-regression/linux-qt/new/deployment.json"))["system_packages"]))')
          docker build --build-arg "XDZIP_RUNTIME_PACKAGES=$PACKAGES" -f apps/desktop/packaging/linux/ci-runtime.Dockerfile -t xdzip-update-qt-runtime apps/desktop/packaging/linux
          docker run --rm --network none --cap-add SYS_PTRACE --env XDZIP_ISOLATED_UPDATE_FIXTURE=1 --mount type=bind,source="$PWD/scripts",target=/repo/scripts,readonly --mount type=bind,source="$PWD/build/update-regression",target=/evidence --workdir /repo xdzip-update-qt-runtime python3 scripts/check-native-qt-update.py --output /evidence/linux-qt --password-task
      - name: Preserve updater evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-regression-linux
          path: |
            build/update-regression/linux/*.json
            build/update-regression/linux/*.log
            build/update-regression/linux-qt/*.json
            build/update-regression/linux-qt/*.log
            build/update-regression/linux-qt/failed-install-recovery/*.json
            build/update-regression/linux-qt/failed-install-recovery/*.log
            build/update-qt-network/qt-network-prepare.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the verified Qt Network dependency
        if: github.ref == 'refs/heads/main' && steps.qt_network.outputs.bundle != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.qt_network.outputs.bundle }}
          path: build/update-qt-network/qt-network.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
