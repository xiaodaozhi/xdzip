name: Windows MSIX lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-msix-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify experimental package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC installation not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $qtRoot = Join-Path $env:RUNNER_TEMP 'Qt'
          $tools = Join-Path $env:RUNNER_TEMP 'desktop-tools'
          $shared = @('--qt-root', $qtRoot, '--qt-prefix', (Join-Path $qtRoot '6.8.2/msvc2022_64'), '--tools-dir', $tools, '--build-dir', 'build/msix-ci-desktop', '--output-dir', 'build/msix-ci-package')
          function Invoke-Desktop([string[]]$Arguments) {
            & python scripts/desktop.py @Arguments @shared
            if ($LASTEXITCODE -ne 0) { throw 'Desktop stage failed' }
          }
          Invoke-Desktop @('prepare', '--install-qt', '--install-rust', '--packaging')
          Invoke-Desktop @('build')
          Invoke-Desktop @('test', '--skip-rust')
          Invoke-Desktop @('package', '--kind', 'runtime')
          Invoke-Desktop @('package', '--kind', 'msix', '--msix-name', 'xdzip.MsixCI', '--msix-publisher', 'CN=xdzip MSIX CI')
          Invoke-Desktop @('verify', '--kind', 'msix')
      - name: Install and remove on the disposable host
        shell: pwsh
        run: ./scripts/check-windows-msix-install.ps1 -Package build/msix-ci-package/xdzip-windows-x64.msix -Output build/msix-ci-package/lifecycle.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msix-lifecycle-${{ github.sha }}
          path: |
            build/msix-ci-package/*.json
            build/msix-ci-desktop/desktop-*.json
            build/msix-ci-desktop/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
