name: Issue 370 installer localization check
on:
  push:
    branches: [coding/370-desktop-localization]
    paths: [.github/workflows/370-installer-localization-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify reused runtime is applicable
        shell: pwsh
        run: |
          $base = '3b22538746858aac84995cb45f5470849803f9c8'
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Runtime revision is not an ancestor' }
          $allowed = @(
            '.github/workflows/370-installer-localization-check.yml',
            'resources/windows-installer-zh-TW.json',
            'scripts/build-windows-installer.py',
            'scripts/test-installers.py'
          )
          foreach ($path in (git diff --name-only $base HEAD)) {
            if ($path -in $allowed -or ($path -like 'docs/*.md') -or ($path -like 'README.*.md')) { continue }
            throw "Runtime input changed: $path"
          }
      - name: Download the previously verified Windows runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 14679517685
          run-id: 44834254525
          github-token: ${{ github.token }}
          path: build/installer-input
          skip-decompress: true
          digest-mismatch: error
      - name: Verify artifact and runtime identity
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'build/installer-input' -File)
          if ($files.Count -ne 1 -or $files[0].Length -ne 80234229) { throw 'Unexpected artifact size' }
          if ((Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '192586942fb277a71cfa2956eb75d3aa83fdf2b3cd494127301023a583b12cfe') { throw 'Artifact digest mismatch' }
          Expand-Archive -LiteralPath $files[0].FullName -DestinationPath 'build/review'
          $build = Get-Content 'build/review/build.json' -Raw | ConvertFrom-Json
          $audit = Get-Content 'build/review/deployment-audit.json' -Raw | ConvertFrom-Json
          if ($build.commit -ne '3b22538746858aac84995cb45f5470849803f9c8' -or $audit.identity.revision -ne '3b2253874685' -or $audit.identity.dirty -ne $false) { throw 'Unexpected runtime identity' }
      - name: Prepare pinned compiler
        shell: pwsh
        run: ./scripts/prepare-windows-installer.ps1 -OutputDirectory build/installer-toolchain
      - name: Compile and check localized messages
        shell: pwsh
        run: |
          python scripts/test-installers.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer unit tests failed' }
          New-Item -ItemType Directory -Force 'build/installer-localization-check' | Out-Null
          python scripts/build-windows-installer.py --root build/review/windows --audit build/review/deployment-audit.json --iscc build/installer-toolchain/compiler/ISCC.exe --chinese build/installer-toolchain/ChineseSimplified.isl --output build/installer-localization-check/setup.exe --report build/installer-localization-check/report.json *> build/installer-localization-check/compile.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/installer-localization-check/compile.log; throw 'Installer compilation failed' }
          if (Select-String -Path build/installer-localization-check/compile.log -SimpleMatch 'has not been defined for the "chinesetraditional" language') { throw 'Traditional Chinese messages fell back to English' }
          $report = Get-Content 'build/installer-localization-check/report.json' -Raw | ConvertFrom-Json
          if ($report.identity.revision -ne '3b2253874685' -or $report.compiler -ne 'Inno Setup 6.7.3') { throw 'Installer report identity mismatch' }
          Write-Output 'Pinned Windows runtime and Inno compiler verified; installer compiled without Traditional Chinese missing-message fallback.'
