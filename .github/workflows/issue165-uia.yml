name: Temporary issue 165 Windows accessibility probe
on:
  push:
    branches: [coding/issue165-uia-probe]
permissions:
  contents: read
jobs:
  windows-uia:
    if: ${{ !contains(github.event.head_commit.message, '[system-proxy]') }}
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Qt and Rust inputs
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw 'aqt install failed' }
          python -m aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE -ne 0) { throw 'Qt installation failed' }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
      - name: Build focused test with guarded MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC unavailable' }
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python scripts/windows_detached_console.py --timeout 2400 -- python .github/issue165-uia/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Focused build failed' }
      - name: Read changing status through Windows UI Automation
        shell: powershell
        run: .\.github\issue165-uia\observe.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue165-windows-uia
          path: build/issue165-evidence/
          if-no-files-found: warn
          retention-days: 14
