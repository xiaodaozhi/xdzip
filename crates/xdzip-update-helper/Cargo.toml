# crates/xdzip-update-helper/Cargo.toml

[package]
name = "xdzip-update-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xdzip-update = { path = "../xdzip-update" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
xdzip-io = { path = "../xdzip-io" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }

[lints]
workspace = true
