[package]
name = "xdzip-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "xdzip"
path = "src/main.rs"

[[bin]]
name = "xdzip-launcher"
path = "src/launcher.rs"

[dependencies]
xdzip-runtime = { path = "../xdzip-runtime" }
xdzip-codec-api = { path = "../xdzip-codec-api" }
xdzip-domain = { path = "../xdzip-domain" }
xdzip-io = { path = "../xdzip-io" }
xdzip-update = { path = "../xdzip-update" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"
sha2 = "=0.10.9"
getrandom = "=0.4.2"
ureq = { version = "=3.5.1", default-features = false, features = ["native-tls-no-default", "socks-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry"] }

[dev-dependencies]
ed25519-dalek = "=2.2.0"

[build-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true
