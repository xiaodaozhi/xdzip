[package]
name = "xdzip-codec-zip"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
xdzip-codec-api = { path = "../xdzip-codec-api" }
xdzip-domain = { path = "../xdzip-domain" }
rawzip = { version = "=0.5.2", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Only AES and the existing pure-Rust Deflate backend; no extra format backends.
zip = { version = "=9.0.3", default-features = false, features = ["aes-crypto", "deflate-flate2"] }
[lints]
workspace = true
