[package]
name = "xdzip-codec-zip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
xdzip-codec-api = { path = "../xdzip-codec-api" }
xdzip-domain = { path = "../xdzip-domain" }
xdzip-compression = { path = "../xdzip-compression" }
aes = { version = "=0.9.3", features = ["zeroize"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha1 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
getrandom = { version = "=0.4.2", default-features = false }
constant_time_eq = "=0.6.1"
zeroize = "=1.9.1"
[dev-dependencies]
rawzip = { version = "=0.5.2", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Independent test oracle only; never linked by the product ZIP implementation.
zip = { version = "=9.0.3", default-features = false, features = ["aes-crypto", "deflate-flate2"] }
[lints]
workspace = true
