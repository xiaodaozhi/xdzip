[package]
name = "xdzip-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[[bin]]
name = "xdzip-plugin-host"
path = "src/main.rs"
[[bin]]
name = "xdzip-sdk-reference"
path = "src/reference.rs"
[dependencies]
xdzip-plugin-protocol = { path = "../xdzip-plugin-protocol" }
xdzip-domain = { path = "../xdzip-domain" }
xdzip-io = { path = "../xdzip-io" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
getrandom = "=0.4.2"
tempfile = "=3.27.0"
cap-std = { version = "=4.0.3", default-features = false }
cap-fs-ext = { version = "=4.0.3", default-features = false, features = ["std"] }
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
[lints]
workspace = true
