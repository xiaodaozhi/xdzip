[package]
name = "xdzip-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
xdzip-extract-plan = { path = "../xdzip-extract-plan" }
xdzip-domain = { path = "../xdzip-domain" }
xdzip-codec-api = { path = "../xdzip-codec-api" }
xdzip-codec-tar = { path = "../xdzip-codec-tar" }
xdzip-codec-zip = { path = "../xdzip-codec-zip" }
xdzip-codec-native = { path = "../xdzip-codec-native" }
xdzip-io = { path = "../xdzip-io" }
unicode-normalization = "=0.1.25"
zeroize = "=1.8.2"
[target.'cfg(windows)'.dependencies]
winapi-util = { version = "=0.1.11", default-features = false }
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
[dev-dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
[lints]
workspace = true
