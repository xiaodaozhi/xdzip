<main>
  <h1>xdzip · M2 实际 Qt 截图</h1>
  <p>真实 ZIP／ZIP64 数据经 Rust 运行时读取，在 Qt 6.8.2 中展示。截图环境为 Linux x86_64、offscreen / software、DPR 1；窗口逻辑尺寸 1024 × 622。这里只记录实际实现，人工验收入口见 <a href="../m2-acceptance.md">M2 验收文档</a>。</p>
  <figure>
    <h2>完整显示十万条物理记录</h2>
    <a href="m2-large-flat.png"><img src="m2-large-flat.png" alt="Qt 加载十万条 ZIP64 记录，列表按需实例化可见委托"></a>
    <figcaption>当前目录全量显示，内部传输批次不出现为产品分页。</figcaption>
  </figure>
  <figure>
    <h2>连续搜索只提交最新结果</h2>
    <a href="m2-latest-query.png"><img src="m2-latest-query.png" alt="连续搜索后，仅保留 item-099999.txt 的最新查询结果"></a>
    <figcaption>过期查询不会覆盖最新搜索与排序意图。</figcaption>
  </figure>
  <figure>
    <h2>分层导航与直属文件</h2>
    <a href="m2-directory.png"><img src="m2-directory.png" alt="十万条分层 ZIP64 中打开目录 d100，显示一千条直属文件"></a>
    <figcaption>普通目录显示直属项；递归搜索结果保留归档内完整路径。</figcaption>
  </figure>
</main>
