<h1>xdzip 画布滚动条修复</h1>
<p>固定画布的根文档不再增加滚动条。文件列表、长属性和操作窗口仍按内容滚动；手机在正常设计尺寸下仍可横向平移。</p>
<figure><h2>修复后常规展示</h2><img src="main-after.png" alt="修复后完整 HTML 审阅入口，画布右侧和底部没有多余滚动条"><figcaption>真实经典滚动条开启，1858 × 1234 浏览器视口，正常设计尺寸。</figcaption></figure>
<figure><h2>负向用例：移除修正规则</h2><img src="reproduced-root-bars.png" alt="移除画布规则后，同一版本出现经典横向和纵向滚动条"><figcaption>同一版本将画布视口缩小 1 px，并移除嵌入规则以复现问题。这是回归用例，不是历史截图。</figcaption></figure>
<figure><h2>相同条件：保留修正规则</h2><img src="stress-fixed.png" alt="相同的画布缩小 1 像素条件下，没有根滚动条且完整窗口仍可见"><figcaption>保持相同 1 px 容错条件，根滚动条占位为零，窗口四边完整可见。</figcaption></figure>
