<h1>xdzip · 解压窗口修订对照</h1>
<p>正常宽度统一为 491 逻辑像素，正文与 footer 操作为 13。HTML 的嵌入和独立入口共用最终尺寸，Qt 直接使用同一契约。下图为实际捕获，没有截图缩小或后期重绘；原稿仅裁去外背景，并按记录的源坐标比例展示。</p>
<nav><a href="../../../design/html/index.html?view=extract&amp;zoom=1">可操作设计稿</a><a href="README.md">修订与验证说明</a><a href="html-validation.json">HTML 记录</a><a href="qt-validation.json">Qt 记录</a></nav>
<h2>默认状态与原稿</h2>
<div class="grid">
<figure><h3>HTML · 100%</h3><a href="html-extract.png"><img src="html-extract.png" alt="正常密度 HTML 解压窗口"></a><figcaption>照片示例，路径栏内嵌更改按钮，范围正文为白色，footer 固定可达。系统装饰为 HTML 外观示意。</figcaption></figure>
<figure><h3>实际 Qt · DPR 1</h3><a href="qt-extract.png"><img src="qt-extract.png" alt="实际 Qt 解压窗口"></a><figcaption>真实 ZIP 和自有目标目录，含目录及文件选择。491×693 客户区；原生系统标题栏不包含在 grabWindow 中。</figcaption></figure>
<figure class="reference"><h3>未修改的高保真原稿</h3><a href="../../../design/hifi/screens/extract-macos.png"><svg xmlns="http://www.w3.org/2000/svg" viewBox="83 59 928 1324" width="491" height="701" role="img" aria-label="裁去外背景的原始高保真窗口"><image href="../../../design/hifi/screens/extract-macos.png" width="1092" height="1440"/></svg></a><figcaption>源坐标采用 819.2／1548 比例，应用窗口宽度约 491；原稿外背景、标题栏与当前真实数据不属于客户区像素一致性承诺。</figcaption></figure>
</div>
<h2>下拉组件</h2><div class="pair">
<figure><h3>HTML</h3><a href="html-dropdown.png"><img src="html-dropdown.png" alt="HTML 内建下拉组件"></a><figcaption>共用选中状态与键盘逻辑；空间不足时向上展开，保持 4 像素间距。</figcaption></figure>
<figure><h3>实际 Qt</h3><a href="qt-dropdown.png"><img src="qt-dropdown.png" alt="实际 Qt 下拉组件"></a><figcaption>实际操作窗口中的菜单，Escape 只关闭选择列表并将焦点归还控件。</figcaption></figure>
