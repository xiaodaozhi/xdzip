"></a></figure><figure class="actual"><figcaption>Qt，移除悬停</figcaption><a href="qt-create-remove-hover.png"><img src="qt-create-remove-hover.png" alt="移除悬停"></a></figure><figure class="actual"><figcaption>Qt，字段焦点</figcaption><a href="qt-create-field-focus.png"><img src="qt-create-field-focus.png" alt="字段焦点"></a></figure><figure class="actual"><figcaption>Qt，下拉展开</figcaption><a href="qt-create-dropdown.png"><img src="qt-create-dropdown.png" alt="下拉展开"></a></figure><figure class="actual"><figcaption>Qt，移除后，源文件仍存在</figcaption><a href="qt-create-removed.png"><img src="qt-create-removed.png" alt="移除后，源文件仍存在"></a></figure></div><p>几何与行为验证不代表像素完全一致；原图插图、历史文件图标和文字抗锯齿差异单独保留。高 DPR 的短屏使用焦点自动滚动，逻辑控件不放大。</p></main></html>
