[workspace]
members = ["crates/xdzip-runtime", "crates/xdzip-qt-bridge", "crates/xdzip-domain", "crates/xdzip-codec-api", "crates/xdzip-codec-zip", "tools/bridge-probe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
cxx = "=1.0.205"
cxx-build = "=1.0.205"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
