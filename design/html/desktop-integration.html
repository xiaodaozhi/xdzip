<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xdzip 系统菜单与托盘设计</title><style>
:root{color-scheme:light dark}[hidden]{display:none!important}img{vertical-align:middle}@media(prefers-color-scheme:dark){img{filter:invert(1)}}body{font:13px system-ui;margin:0;background:light-dark(#eef1f6,#202630);color:light-dark(#18202e,#eef2fa)}header,main{padding:24px;max-width:1040px;margin:auto}button,select{font:inherit;padding:7px 12px;border:1px solid light-dark(#dce2ec,#485469);border-radius:5px;background:light-dark(#fafbfd,#303b49);color:inherit}button:hover{background:light-dark(#e5edff,#3b4e69)}button:active{background:#2364ed;color:white}button:disabled{opacity:.4}nav{display:flex;gap:4px;background:light-dark(#ffffffb8,#303743);padding:5px;border-radius:8px}.workspace{height:180px;margin:18px 0;border:1px solid light-dark(#dce2ec,#485469);border-radius:12px;display:grid;place-content:center}.menus{display:flex;gap:24px;flex-wrap:wrap}.panel{width:260px;padding:6px;border-radius:9px;background:light-dark(#fff,#303743);box-shadow:0 8px 24px #0002}.panel button{display:block;text-align:left;width:100%;border:0;background:transparent}.panel button:hover{background:#2364ed;color:white}.panel hr{border:0;border-top:1px solid #8884;margin:5px}.panel small{float:right;opacity:.65}.submenu{position:fixed;z-index:5}.submenu button{white-space:nowrap}p{line-height:1.8}#status{min-height:24px}.state{color:#4b87ff}label{display:inline-flex;gap:8px;align-items:center}svg{vertical-align:middle}</style>
<header><h1>系统菜单与托盘</h1><p>原生菜单结构与交互稿，系统决定实际外观、字体及尺寸。保留现有主窗口标题栏。</p><label>平台 <select id="platform"><option>macOS</option><option>Windows</option><option>Linux</option></select></label> <label><input id="tray" type="checkbox" checked>显示托盘图标</label> <label><input id="busy" type="checkbox">有后台任务</label></header><main>
<nav id="bar"></nav><div class="workspace" id="workspace">xdzip 主窗口，标题栏保持原样</div><div class="menus"><section><h3 id="menu-title">文件</h3><div id="menu" class="panel"></div></section><section><h3><img src="../assets/tray/black-22.png" alt="xdzip 托盘图标" width="22" height="22"> 托盘菜单</h3><div id="tray-menu" class="panel"></div></section></div><p id="status" role="status"></p><p>关闭窗口后任务继续；明确退出时仍需处理活跃任务。托盘不可用时恢复正常关闭。菜单示例不访问磁盘或启动真实任务。</p></main><script>
const groups={'xdzip':['关于 xdzip','设置…','|','服务','隐藏 xdzip','隐藏其他','显示全部','|','退出 xdzip'],'文件':['打开压缩包…','新建压缩包…','最近打开 ›','|','关闭当前压缩包','关闭窗口'],'编辑':['撤销','重做','|','剪切','复制','粘贴','全选','查找…'],'显示':['✓ 列表','网格','✓ 文件预览与属性'],'操作':['全部解压…','解压所选…','解压元数据预检…'],'窗口':['最小化','缩放','|','显示主窗口','任务 ›','|','✓ xdzip'],'帮助':['使用说明','反馈问题','|','关于 xdzip']};
const $=s=>document.querySelector(s);function action(t){if(t==='关闭窗口'){if($('#tray').checked){$('#workspace').textContent='主窗口已隐藏，后台任务继续';}else $('#workspace').textContent='进入安全退出流程';}else if(t==='显示主窗口')$('#workspace').textContent='xdzip 主窗口，标题栏保持原样';else if(t==='退出 xdzip'){$('#status').textContent=$('#busy').checked?'退出确认：等待任务完成，或取消任务并退出，或返回应用':'执行异步清理后退出';return;}$('#status').textContent='已触发：'+t;}function submenu(button,items){document.querySelector('.submenu')?.remove();let panel=document.createElement('div');panel.className='panel submenu';document.body.append(panel);render(panel,items);const box=button.getBoundingClientRect();panel.style.left=Math.max(8,Math.min(innerWidth-284,box.right+4))+'px';panel.style.top=Math.max(8,Math.min(innerHeight-panel.offsetHeight-8,box.top))+'px';panel.querySelector('button')?.focus();}function render(el,items){el.replaceChildren();items.forEach(t=>{let e=document.createElement(t==='|'?'hr':'button');if(t!=='|'){e.textContent=t;e.onclick=()=>t.startsWith('任务')?submenu(e,$('#busy').checked?['解压，任务 1    进行中','创建，任务 2    等待中']:['暂无任务']):t==='最近打开 ›'?submenu(e,['示例压缩包.zip']):action(t);if(t==='暂无任务')e.disabled=true;}el.append(e);});}document.addEventListener('pointerdown',e=>{if(!e.target.closest('.submenu')&&!e.target.textContent.startsWith('任务'))document.querySelector('.submenu')?.remove();});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.submenu')?.remove();});function update(){document.querySelector('.submenu')?.remove();let mac=$('#platform').value==='macOS';$('#bar').hidden=!mac;render($('#tray-menu'),['显示主窗口','打开压缩包…','新建压缩包…','|','任务，'+($('#busy').checked?'2':'0')+' 个进行中 ›','|','设置…','关于 xdzip','|','退出 xdzip']);$('#tray-menu').style.opacity=$('#tray').checked?1:.35;if(!$('#tray').checked)$('#workspace').textContent='xdzip 主窗口，关闭托盘前恢复显示';}Object.keys(groups).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{$('#menu-title').textContent=k;render($('#menu'),groups[k]);};$('#bar').append(b);});render($('#menu'),groups['文件']);['platform','tray','busy'].forEach(id=>$('#'+id).onchange=update);update();
</script></html>
