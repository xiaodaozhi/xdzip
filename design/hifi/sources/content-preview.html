<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>xdzip 内容预览状态稿</title>
<style>
@font-face{font-family:xdzip;src:url('../../assets/fonts/xdzip-design-sans-sc.ttf')}
:root{font-family:xdzip,system-ui,sans-serif;color:#28344c;background:#eef2f7;--surface:#fff;--canvas:#f5f7fb;--line:#dce2ec;--secondary:#758096;--text:#28344c;--danger:#bb414d;--hover:#e9eef6;--scale:1}
body{margin:24px}body.dark{background:#161d2b;--surface:#202a3a;--canvas:#182131;--line:#485469;--secondary:#a7b3c7;--text:#e6edf7;--danger:#ff939c;--hover:#344057;color:var(--text)}
nav{display:flex;gap:12px;align-items:center;margin-bottom:24px}label,button,select{font:inherit;font-size:13px}button,select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 12px;cursor:pointer}button:hover{background:var(--hover)}
main{display:flex;gap:24px;flex-wrap:wrap}.panel{box-sizing:border-box;width:258px;background:var(--surface);padding:13.23px 11.91px 16px 13.23px;border:1px solid var(--line)}h2{font-size:calc(13px*var(--scale));margin:0 0 16px;font-weight:600}.card{position:relative;box-sizing:border-box;height:183.235px;padding:9.6px;border:1px solid var(--line);border-radius:6px;background:var(--canvas);display:flex;flex-direction:column;gap:6.4px}.content{flex:1;min-height:0;overflow:auto;font-family:system-ui,sans-serif;font-size:calc(12px*var(--scale));white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.hint{display:grid;place-content:center;white-space:normal;text-align:center;color:var(--secondary)}.error{color:var(--danger)}.card button{align-self:center}.filename{font-size:calc(14px*var(--scale));overflow-wrap:anywhere;margin:11px 0 4px;font-weight:600}.content svg{width:100%;height:100%}
.refresh{position:absolute;top:5px;right:5px;box-sizing:border-box;width:28px;height:28px;border-radius:3px;padding:0;display:grid;place-items:center;opacity:0}.refresh svg{width:16px;height:16px}.card:hover .refresh,.refresh:focus-visible{opacity:1}
.card [hidden]{display:none}
</style>
<nav>
  <label>Language <select id="language"><option value="zh">简体中文</option><option value="en">English</option></select></label>
  <label data-zh="效果" data-en="Appearance">效果</label><select id="theme" aria-label="Theme"><option>Light</option><option>Dark</option></select>
  <label data-zh="字号" data-en="Text size">字号</label><select id="scale" aria-label="Text size"><option>100%</option><option>125%</option><option>150%</option></select>
</nav>
<main>
  <section class="panel">
    <h2 data-zh="纯文本" data-en="Plain text">纯文本</h2>
    <div class="card" data-refresh>
      <div class="content">先浏览，再解压。
&lt;h1&gt;这段文本不会作为 HTML 执行&lt;/h1&gt;

Archive contents remain plain text.</div>
    </div>
    <p class="filename">README.md</p>
  </section>
  <section class="panel">
    <h2 data-zh="图片" data-en="Image">图片</h2>
    <div class="card" data-refresh>
      <div class="content"><svg viewBox="0 0 240 130" role="img" aria-label="Sample landscape"><rect width="240" height="130" fill="#dcecf8"/><circle cx="185" cy="32" r="13" fill="#f6cd65"/><path d="M0 130L70 42l65 88M75 130l63-62 102 62" fill="#497d85"/></svg></div>
    </div>
    <p class="filename">landscape.png</p>
  </section>
  <section class="panel">
    <h2 data-zh="多选" data-en="Multiple selection">多选</h2>
    <div class="card"><div class="content hint" data-zh="已选择多个项目" data-en="Multiple items selected">已选择多个项目</div></div>
  </section>
  <section class="panel">
    <h2 data-zh="预览失败" data-en="Preview failed">预览失败</h2>
    <div class="card" data-refresh><div class="content hint error" data-zh="图片无法解码，内容未显示。" data-en="The image could not be decoded.">图片无法解码，内容未显示。</div></div>
    <p class="filename">photo.png</p>
  </section>
</main>
<template id="actions">
  <button class="refresh" type="button" aria-label="重新加载预览">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.07 5.09a5 5 0 1 0 .24 5.45M12.4 2.4v2.8H9.6"/></svg>
  </button>
  <div class="content hint loading" hidden data-zh="正在读取并校验…" data-en="Reading and verifying…">正在读取并校验…</div>
  <button class="cancel" type="button" hidden data-zh="取消" data-en="Cancel">取消</button>
</template>
<script>
const language = document.querySelector('#language');
function translate() {
    document.querySelectorAll('[data-zh]').forEach(node => node.textContent = node.dataset[language.value]);
    document.querySelectorAll('.refresh').forEach(button => button.ariaLabel = language.value === 'zh' ? '重新加载预览' : 'Reload preview');
    document.documentElement.lang = language.value === 'zh' ? 'zh-CN' : 'en-US';
}
for (const card of document.querySelectorAll('[data-refresh]')) {
    const content = card.firstElementChild;
    card.append(document.querySelector('#actions').content.cloneNode(true));
    const refresh = card.querySelector('.refresh');
    const loading = card.querySelector('.loading');
    const cancel = card.querySelector('.cancel');
    let timer;
    function setLoading(active) {
        content.hidden = active;
        refresh.hidden = active;
        loading.hidden = !active;
        cancel.hidden = !active;
    }
    refresh.onclick = () => {
        setLoading(true);
        timer = setTimeout(() => setLoading(false), 650);
    };
    cancel.onclick = () => {
        clearTimeout(timer);
        setLoading(false);
    };
}
language.onchange = translate;
document.querySelector('#theme').onchange = event => document.body.classList.toggle('dark', event.target.value === 'Dark');
document.querySelector('#scale').onchange = event => document.documentElement.style.setProperty('--scale', parseInt(event.target.value) / 100);
</script></html>
