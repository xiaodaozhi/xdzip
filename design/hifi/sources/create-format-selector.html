<main><h1>C01 格式选择修订</h1><p>格式增加后使用共享下拉框，保持窗口 491 逻辑像素宽和既有字段尺寸。选项使用稳定格式标识，GZIP 只接受一个普通文件。左侧标签、滚动正文和固定底部按钮继续遵守共享规则。原始 C01 图片及历史量测保持不变。</p><p><a href="../../html/index.html?view=create">打开完整交互稿，切换浅深色和缩放</a>，<a href="../../../specs/visual/create-reference.json">原稿与修订依据</a>，<a href="../../../specs/visual/layout-scale.json">共享尺寸</a>。</p><iframe title="创建窗口交互稿" src="../../html/index.html?view=create"></iframe></main>
