<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S01 设置，六个标签页</title><style>body{margin:0;background:#e8ebf0;color:#141827;font:13px system-ui,sans-serif}nav{height:64px;display:flex;align-items:center;gap:18px;padding:0 24px}a{color:#1956ff}iframe{display:block;border:0;margin:0 auto}body.export nav{display:none}</style><nav><strong>S01 设置</strong><a href="?tab=appearance">外观</a><a href="?tab=general">通用</a><a href="?tab=privacy">隐私</a><a href="?tab=associations">文件关联</a><a href="?tab=network">网络</a><a href="?tab=about">关于</a><a href="?tab=about&channel=msix">MSIX 关于</a><a href="?tab=about&update=checking">检查中</a><a href="?tab=about&update=available">发现更新</a><a href="?tab=about&update=downloading">下载中</a><a href="?hover=general">悬停状态</a><a href="?theme=dark">深色</a></nav><iframe title="设置窗口设计原稿"></iframe><script>
const q=new URLSearchParams(location.search),theme=q.get('theme')==='dark'?'dark':'light',tab=q.get('tab')||'appearance',frame=document.querySelector('iframe');
if(q.has('export'))document.body.classList.add('export');
frame.width=1586;frame.height=1100;frame.src='../../html/canvas.html?view=settings'+(q.get('lang')?'&lang='+encodeURIComponent(q.get('lang')):'');
const updateStates={
 checking:{state:'checking'},
 available:{state:'available',trusted:true,canInstall:false,version:'0.1.0-alpha.9'},
 installable:{state:'available',trusted:true,canInstall:true,version:'0.1.0-alpha.9'},
 downloading:{state:'downloading',trusted:true,canInstall:false,progress:.42},
 downloaded:{state:'downloaded',trusted:true,canInstall:false,downloaded:true},
 recovery:{state:'recovery_required',downloaded:true}
};
frame.addEventListener('load',()=>{frame.contentWindow.postMessage({type:'xdzip-review-configure',view:'settings',platform:q.get('channel')==='msix'?'windows':'macos',theme},'*');setTimeout(()=>{frame.contentWindow.document.getElementById('settings-tab-'+tab)?.click();const hover=q.get('hover');if(hover)frame.contentWindow.document.getElementById('settings-tab-'+hover)?.setAttribute('data-preview-hover','true');const update=updateStates[q.get('update')];if(tab==='about'&&update)frame.contentWindow.XdzipAboutUpdatePreview?.(update);if(tab==='about'&&q.get('channel')==='msix'){const section=frame.contentWindow.document.getElementById('about-update-section');const title=section?.previousElementSibling;const separator=title?.previousElementSibling;if(section&&title&&separator){section.style.display='none';title.style.display='none';separator.style.display='none';}}},100)});
</script></html>
