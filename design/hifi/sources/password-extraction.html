<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>密码解压，P02 高保真状态稿</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
:root{color-scheme:light;--canvas:#e8ebf0;--surface:#fff;--text:#141827;--secondary:#626b86;--border:#dce2ec;--accent:#1956ff;--accent-hover:#124be0;--accent-pressed:#0b38b5;--danger:#b93848;--disabled:#e4eaf5;--disabled-text:#738098;--scale:1}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:13px/1.5 "Xdzip Design Sans SC",sans-serif}body.dark{color-scheme:dark;--canvas:#171d25;--surface:#22262f;--text:#f0f2f8;--secondary:#a7b0c7;--border:#485469;--accent:#3264e9;--accent-hover:#3874ee;--accent-pressed:#2355ba;--danger:#ffa0ad;--disabled:#29364d;--disabled-text:#8c9ab2}nav{padding:20px;display:flex;gap:18px;flex-wrap:wrap;font-size:13px}a{color:var(--accent)}article{width:491px;max-width:calc(100vw - 32px);margin:24px auto;display:flex;flex-direction:column;max-height:min(600px,calc(100dvh - 100px));background:var(--surface);border-radius:10px;box-shadow:0 14px 45px #0002;overflow:hidden}.native-caption{height:36px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;background:color-mix(in srgb,var(--surface),var(--canvas) 40%)}main{padding:24px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}h1{margin:0;font-size:calc(20px * var(--scale));line-height:1.4}p{margin:0;font-size:calc(13px * var(--scale));line-height:1.5;color:var(--secondary)}.filename{color:var(--text);overflow-wrap:anywhere}.label{font-size:calc(13px * var(--scale));font-weight:600}.input-row{display:flex;gap:10px;min-width:0}input{min-width:0;min-height:28px;line-height:1.35;width:100%;padding:4px 8px;font:inherit;font-size:calc(13px * var(--scale));line-height:1.35;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:5px}input::placeholder{color:var(--secondary)}button{flex:none;min-height:28px;padding:4px 12px;border:1px solid var(--border);border-radius:5px;color:var(--text);background:var(--surface);font:inherit;font-size:calc(13px * var(--scale));line-height:1.35}button:hover:not(:disabled){background:color-mix(in srgb,var(--accent),var(--surface) 94%)}button:active:not(:disabled){background:color-mix(in srgb,var(--accent),var(--surface) 84%)}button:disabled{color:var(--secondary)}.primary:disabled{background:var(--disabled);color:var(--disabled-text)}.primary{background:var(--accent);color:white;border-color:transparent}.primary:hover:not(:disabled){background:var(--accent-hover)}.primary:active:not(:disabled){background:var(--accent-pressed)}:focus{outline:none}.error{color:var(--danger)}.note{font-size:calc(12px * var(--scale))}footer{flex:none;display:flex;justify-content:flex-end;align-items:stretch;gap:10px;padding:12px 25px;border-top:1px solid var(--border);min-height:64px}footer button{min-width:77px;min-height:32px;flex:0 1 auto;white-space:normal}footer .primary{min-width:94px}
</style>
<nav><strong>密码解压，P02，491 逻辑宽度</strong><a href="?">输入密码</a><a href="?retry=1">错误重试</a><a href="?pending=1">正在提交</a><a href="?lang=en-US&scale=1.5">English 150%</a><a href="?theme=dark">深色</a><a href="../../html/index.html?view=password">可操作 HTML</a></nav>
<article aria-label="解压密码"><div class="native-caption">解压密码</div><main><h1>输入密码以继续解压</h1><p class="description">此文件已加密，需要密码才能继续。</p><p class="filename">项目资料 / 设计文件.pdf</p><label class="label" for="password">密码</label><div class="input-row"><input id="password" type="password" autocomplete="off" placeholder="输入此压缩包的密码" aria-label="密码"><button id="show">显示密码</button></div><p class="error" hidden>密码不正确，请重试。</p><p class="note">密码仅用于当前任务，不会保存。关闭此窗口将取消任务。</p></main><footer><button id="cancel">取消任务</button><button class="primary" id="submit">继续解压</button></footer></article>
<script>
const q=new URLSearchParams(location.search),english=q.get('lang')==='en-US',pending=q.get('pending')==='1';document.body.classList.toggle('dark',q.get('theme')==='dark');document.documentElement.style.setProperty('--scale',['1','1.25','1.5'].includes(q.get('scale'))?q.get('scale'):'1');document.querySelector('.error').hidden=q.get('retry')!=='1';if(english){document.documentElement.lang='en-US';for(const [selector,text] of [['.native-caption','Extraction password'],['h1','Enter a password to continue'],['.description','This file is encrypted. Enter its password to continue.'],['.filename','Project materials / Design document.pdf'],['.label','Password'],['#show','Show password'],['.error','Incorrect password. Try again.'],['.note','Your password is used only for this task and is not saved. Closing this window cancels the task.'],['#cancel','Cancel task'],['#submit','Continue extraction']])document.querySelector(selector).textContent=text;document.querySelector('input').placeholder='Enter the archive password'}if(pending){document.querySelector('#submit').textContent=english?'Submitting…':'正在提交…';document.querySelectorAll('input,#show,#submit').forEach(el=>el.disabled=true)}document.querySelector('#show').onclick=()=>{const input=document.querySelector('input'),show=input.type==='password';input.type=show?'text':'password';document.querySelector('#show').textContent=english?(show?'Hide password':'Show password'):(show?'隐藏密码':'显示密码')};for(const id of ['cancel','submit'])document.querySelector('#'+id).onclick=()=>{document.querySelector('input').value='';document.querySelector('input').type='password';document.querySelector('article').hidden=true};
</script></html>
